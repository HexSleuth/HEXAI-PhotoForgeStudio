            let currentTheme = 'Dark (Default)';
            let customColors = {};

            const themeSelect = document.getElementById('systemThemeSelect');
            const customBgColorInput = document.getElementById('customBgColor');
            const customBgColorItem = document.getElementById('customBgColorItem');
            const themeResetBtn = document.getElementById('themeResetBtn');

            const defaultTheme = 'Dark (Default)';
            const defaultCustomColor = '#000000';

            // Populate the select dropdown dynamically
            function populateThemeSelect() {
                themeSelect.innerHTML = '';
                // Add dark default option
                const darkOption = document.createElement('option');
                darkOption.value = 'Dark (Default)';
                darkOption.textContent = 'Dark (Default)';
                themeSelect.appendChild(darkOption);

                // Add all DaisyUI themes
                THEMES.forEach(theme => {
                    const option = document.createElement('option');
                    option.value = theme;
                    option.textContent = theme.charAt(0).toUpperCase() + theme.slice(1);
                    themeSelect.appendChild(option);
                });

                // Add custom option
                const customOption = document.createElement('option');
                customOption.value = 'custom';
                customOption.textContent = 'Custom';
                themeSelect.appendChild(customOption);

                // Set default selected
                themeSelect.value = defaultTheme;
            }

            function removeThemeClasses() {
                const themeClasses = [
                    'dark-theme', 'midnight-theme', 'light-theme',
                    'cyberpunk-theme', 'matrix-green-theme', 'custom-theme'
                ];
                themeClasses.forEach(cls => document.body.classList.remove(cls));
            }

            function applyTheme(theme) {
                removeThemeClasses();
                let bgColor = '#000'; // default dark
                if (theme === 'custom') {
                    bgColor = customBgColorInput.value;
                    document.body.classList.add('custom-theme');
                } else if (theme !== 'Dark (Default)') {
                    const swatch = THEME_SWATCHES[theme];
                    if (swatch && swatch.length >= 4) {
                        bgColor = swatch[3]; // use 4th color as background
                    }
                }
                // Apply background color to body and main matrix canvas
                document.body.style.backgroundColor = bgColor;
                const mainCanvas = document.getElementById('matrixCanvas');
                if (mainCanvas) {
                    mainCanvas.style.backgroundColor = bgColor;
                }
            }

            function updateCustomBgVisibility() {
                if (themeSelect.value === 'custom') {
                    customBgColorItem.style.display = 'flex';
                } else {
                    customBgColorItem.style.display = 'none';
                }
            }

            // Event listeners
            themeSelect.addEventListener('change', function() {
                updateCustomBgVisibility();
                applyTheme(themeSelect.value);
                currentTheme = themeSelect.value;
            });

            customBgColorInput.addEventListener('input', function() {
                if (themeSelect.value === 'custom') {
                    applyTheme('custom');
                }
            });

            themeResetBtn.addEventListener('click', function() {
                themeSelect.value = defaultTheme;
                customBgColorInput.value = defaultCustomColor;
                updateCustomBgVisibility();
                applyTheme(defaultTheme);
                currentTheme = defaultTheme;
            });

            // Initialize
            populateThemeSelect();
            updateCustomBgVisibility();
            applyTheme(defaultTheme);
        })();
        //]]>
    </script>

    <!-- ============================================================
    LOADING LOGIC (with terminal matrix activation)
    ============================================================ -->
    <script>
        //<![CDATA[
        (function() {
            var progressBar = document.getElementById('progressBar');
            var statusText = document.getElementById('statusText');
            var loaderWrapper = document.getElementById('loader-wrapper');
            var clickLogo = document.getElementById('clickLogo');
            var clickHint = document.getElementById('clickHint');
            var blogContent = document.getElementById('blog-content');
            var progress = 0;
            var interval = null;
            var started = false;

            window.startLoading = function() {
                if (started) return;
                started = true;
                clickHint.style.display = 'none';
                window.matrixControl.setActive(true);
                clickLogo.classList.add('touched');

                var loadingStages = [
                    { threshold: 0, message: 'Loading Resources...' },
                    { threshold: 25, message: 'Connecting to Server...' },
                    { threshold: 50, message: 'Fetching Data...' },
                    { threshold: 75, message: 'Rendering Matrix...' },
                    { threshold: 90, message: 'Finalizing...' },
                    { threshold: 100, message: 'Welcome!' }
                ];

                var stageIndex = 0;
                interval = setInterval(function() {
                    progress = Math.min(progress + Math.random() * 8 + 3, 100);

                    while (stageIndex < loadingStages.length && progress >= loadingStages[stageIndex]
                        .threshold) {
                        statusText.innerText = loadingStages[stageIndex].message;
                        stageIndex++;
                    }

                    progressBar.style.width = progress + '%';

                    if (progress >= 100) {
                        clearInterval(interval);
                        statusText.innerText = 'Welcome!';
                        statusText.classList.add('success');

                        if (document.getElementById('matrixShowTerminal').checked &&
                            window.terminalMatrixControl) {
                            window.terminalMatrixControl.setActive(true);
                        }

                        setTimeout(function() {
                            loaderWrapper.classList.add('fade-out');
                            setTimeout(function() {
                                loaderWrapper.style.display = 'none';
                                blogContent.style.display = 'block';
                                window.matrixControl.setActive(true);
                            }, 600);
                        }, 400);
                    }
                }, 120);
            };

            clickLogo.addEventListener('click', window.startLoading);
            clickLogo.addEventListener('touchstart', function(e) {
                e.preventDefault();
                window.startLoading();
            }, { passive: false });

            clickHint.addEventListener('click', window.startLoading);
            clickHint.addEventListener('touchstart', function(e) {
                e.preventDefault();
                window.startLoading();
            }, { passive: false });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    if (!started) window.startLoading();
                }
            });
        })();
        //]]>
    </script>
