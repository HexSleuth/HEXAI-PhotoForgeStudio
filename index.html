<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d2b45">
    <meta name="description" content="PhotoForge Studio – Advanced Web-Based Image Editor with Auto-Save & Local Storage">
    <title>PhotoForge Studio</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tui-color-picker@2.2.8/dist/tui-color-picker.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tui-image-editor@3.15.3/dist/tui-image-editor.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tui-code-snippet@2.3.1/dist/tui-code-snippet.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tui-color-picker@2.2.8/dist/tui-color-picker.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.1/dist/fabric.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tui-image-editor@3.15.3/dist/tui-image-editor.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>

    <style>
        :root {
            --banner: #000000;
            --side: #0a1628;
            --middle: #0a0a14;
            --bg-primary: #000000;
            --bg-secondary: #0a1628;
            --bg-tertiary: #0d2b45;
            --bg-surface: #0a0a14;
            --accent: #1a5276;
            --accent-light: #4da6cc;
            --accent-hover: #2a6a8e;
            --text-primary: #e0e0e0;
            --text-secondary: #bbb;
            --text-muted: #777;
            --border-color: rgba(26, 82, 118, 0.35);
            --border-accent: #1a5276;
            --shadow: rgba(0, 0, 0, 0.6);
            --danger: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
            --font-main: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --left-panel-width: 250px;
            --right-panel-width: 240px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #pf-app {
            display: grid;
            grid-template-columns: 0px 1fr 0px;
            grid-template-rows: 50px 40px 1fr;
            grid-template-areas:
                "banner banner banner"
                "menu menu menu"
                "left middle right";
            width: 100vw;
            height: 100vh;
            background: var(--bg-primary);
            overflow: hidden;
            position: relative;
            transition: grid-template-columns 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #pf-app.left-open {
            grid-template-columns: var(--left-panel-width) 1fr 0px;
        }

        #pf-app.right-open {
            grid-template-columns: 0px 1fr var(--right-panel-width);
        }

        #pf-app.left-open.right-open {
            grid-template-columns: var(--left-panel-width) 1fr var(--right-panel-width);
        }

        /* ================= BANNER ================= */
        #banner {
            grid-area: banner;
            background: linear-gradient(135deg, #000000 0%, #0a1628 30%, #0d2b45 60%, #000000 100%);
            border-bottom: 2px solid var(--border-accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            z-index: 30;
            min-height: 50px;
            overflow-x: auto;
            gap: 8px;
        }

        .pf-brand {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .pf-brand-text {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.4px;
            white-space: nowrap;
            user-select: none;
        }
        .pf-brand-text span {
            color: var(--accent-light);
            font-weight: 400;
        }

        .banner-actions {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-shrink: 0;
        }
        .banner-actions::-webkit-scrollbar {
            display: none;
        }

        .banner-btn {
            background: linear-gradient(25deg, #371cd3f5, #9fb1d3);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            padding: 6px 9px;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: var(--transition);
            box-shadow: 0 2px 10px rgba(13, 43, 69, 0.5);
            flex-shrink: 0;
            font-family: var(--font-main);
            letter-spacing: 0.2px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .banner-btn:hover {
            background: linear-gradient(25deg, #9fb1d3, #371cd3f5);
            box-shadow: 0 4px 14px rgba(13, 43, 69, 0.7);
        }
        .banner-btn:active {
            transform: scale(0.94);
        }

        .banner-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-accent);
            border-radius: var(--radius-sm);
            color: #ccc;
            padding: 6px 9px;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: var(--font-main);
            letter-spacing: 0.2px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .banner-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-color: var(--accent-light);
        }
        .banner-btn-secondary:active {
            transform: scale(0.94);
        }

        .banner-divider {
            border-left: 1px solid var(--border-accent);
            height: 20px;
            margin: 0 2px;
            flex-shrink: 0;
        }

        /* ================= MENU BAR ================= */
        #menu-bar {
            grid-area: menu;
            background: #000000;
            border-bottom: 1px solid var(--border-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 10px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            z-index: 25;
        }
        #menu-bar::-webkit-scrollbar {
            display: none;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-accent);
            border-radius: var(--radius-sm);
            color: #ccc;
            padding: 5px 9px;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: var(--font-main);
            letter-spacing: 0.2px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border-color: var(--accent-light);
        }
        .menu-btn:active {
            transform: scale(0.94);
        }

        /* ================= LEFT PANEL ================= */
        #left {
            grid-area: left;
            background: var(--side);
            border-right: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 20;
            min-width: 0;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        #left.closed {
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #left h4 {
            color: var(--accent-light);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            user-select: none;
        }

        .pf-slider-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .pf-slider-group label {
            color: var(--accent-light);
            font-weight: 600;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.62rem;
            user-select: none;
        }
        .pf-slider-group input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(26, 82, 118, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .pf-slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        .pf-slider-group input[type="range"]::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        .pf-slider-value {
            font-size: 0.58rem;
            color: var(--text-muted);
            min-width: 22px;
            text-align: right;
            font-weight: 700;
        }
        .pf-slider-reset {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.62rem;
            transition: var(--transition);
            padding: 1px;
            background: none;
            border: none;
        }
        .pf-slider-reset:hover {
            color: #fff;
        }

        .action-tool {
            justify-content: center;
            height: 34px;
            width: 100%;
            margin: 2px 0;
            color: #fff;
            background: rgba(26, 82, 118, 0.3);
            outline: none;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-main);
            letter-spacing: 0.2px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .action-tool:hover {
            background: #3e6581;
            color: white;
            box-shadow: 0px 4px 8px 0px var(--shadow);
        }
        .action-tool:active {
            transform: scale(0.96);
        }
        .action-tool i {
            font-size: 0.75rem;
        }

        /* ================= LEFT TOGGLE BUTTON ================= */
        #left-toggle-btn {
            position: fixed;
            left: 0;
            top: 55%;
            transform: translateY(-50%);
            z-index: 60;
            background: linear-gradient(135deg, #0d2b45, #1a5276);
            border: 1px solid var(--border-accent);
            border-left: none;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            color: #fff;
            width: 26px;
            height: 56px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            letter-spacing: 0.5px;
        }
        #left-toggle-btn:hover {
            background: linear-gradient(135deg, #1a5276, #2a6a8e);
            width: 30px;
        }
        #left-toggle-btn:active {
            transform: translateY(-50%) scale(0.92);
        }
        #left-toggle-btn i {
            transition: transform 0.35s ease;
        }
        #left-toggle-btn.open i {
            transform: rotate(180deg);
        }

        /* ================= RIGHT PANEL (GALLERY) ================= */
        #right {
            grid-area: right;
            background: var(--side);
            border-left: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 20;
            min-width: 0;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        #right.closed {
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #right h4 {
            color: var(--accent-light);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            user-select: none;
        }
        .gallery-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .gallery-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .gallery-item:hover {
            border-color: var(--accent-light);
        }
        .gallery-item img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .gallery-item-info {
            flex: 1;
            font-size: 0.6rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            user-select: none;
        }
        .gallery-item-actions {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }
        .gallery-item-actions button {
            background: none;
            border: none;
            color: var(--accent-light);
            cursor: pointer;
            font-size: 0.7rem;
            transition: var(--transition);
            padding: 3px;
        }
        .gallery-item-actions button:hover {
            color: #fff;
            transform: scale(1.15);
        }

        /* ================= MIDDLE ================= */
        #middle {
            grid-area: middle;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }
        #tui-image-editor {
            width: 100%;
            height: 100%;
        }
        .pf-editor-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .pf-toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(10, 16, 28, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 999;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-accent);
            white-space: nowrap;
            max-width: 85%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pf-toast.pf-show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .pf-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .pf-loading.pf-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .pf-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(26, 82, 118, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: pf-spin 0.9s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes pf-spin {
            to {
                transform: rotate(360deg);
            }
        }
        .pf-loading-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .pf-loading-sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ================= TUI OVERRIDES ================= */
        #tui-image-editor .tui-image-editor-container,
        #tui-image-editor .tui-image-editor-main,
        #tui-image-editor .tui-image-editor-submenu,
        #tui-image-editor .tui-image-editor-menu,
        #tui-image-editor .tui-image-editor-controls {
            background: #000000 !important;
        }
        #tui-image-editor .tui-image-editor {
            border-radius: 0;
            background: var(--bg-surface);
        }
        #tui-image-editor .tui-image-editor-header {
            display: none !important;
        }
        #tui-image-editor .tui-image-editor-menu {
            background: #000000;
            border-top: 1px solid var(--border-accent);
            padding: 0;
        }
        #tui-image-editor .tui-image-editor-item {
            background: transparent;
            border: none;
            color: #bbb;
            padding: 7px 9px;
            font-size: 10px;
            font-family: var(--font-main);
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 5px;
            margin: 1px;
        }
        #tui-image-editor .tui-image-editor-item:hover {
            background: rgba(26, 82, 118, 0.2);
            color: #fff;
        }
        #tui-image-editor .tui-image-editor-item.active {
            background: rgba(26, 82, 118, 0.35);
            color: var(--accent-light);
            font-weight: 600;
        }
        #tui-image-editor .tui-image-editor-submenu {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-accent);
        }
        #tui-image-editor .tui-image-editor-controls {
            background: #000000;
        }
        #tui-image-editor .tui-image-editor-controls-logo,
        #tui-image-editor .tui-image-editor-header-logo {
            display: none;
        }
        #tui-image-editor .tui-colorpicker-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-accent);
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }
        #tui-image-editor .tui-image-editor-range {
            background: rgba(26, 82, 118, 0.25);
            border-radius: 3px;
            height: 4px;
        }
        #tui-image-editor .tui-image-editor-range-pointer {
            background: var(--accent);
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            width: 13px;
            height: 13px;
            border-radius: 50%;
            cursor: pointer;
        }
        #tui-image-editor .tui-image-editor-crop-area {
            border-color: var(--accent) !important;
        }
        #tui-image-editor .tui-image-editor-crop-handle {
            background-color: var(--accent) !important;
            border-color: #fff !important;
        }

        .pf-file-input {
            display: none;
        }

        /* ================= MODAL ================= */
        .pf-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .pf-modal-overlay.pf-active {
            opacity: 1;
            pointer-events: all;
        }
        .pf-modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-accent);
            border-radius: var(--radius-lg);
            padding: 18px;
            max-width: 92%;
            width: 400px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .pf-modal-overlay.pf-active .pf-modal-box {
            transform: translateY(0);
        }
        .pf-modal-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .pf-modal-body {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.5;
            text-align: center;
            margin-bottom: 14px;
        }
        .pf-modal-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .pf-modal-close-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .pf-modal-close-btn:hover {
            color: #fff;
        }
        .pf-btn {
            padding: 6px 10px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: var(--font-main);
            letter-spacing: 0.2px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .pf-btn:active {
            transform: scale(0.93);
        }
        .pf-btn-primary {

        /* ================= RESPONSIVE ================= */

</head>
<body>
    <div id="pf-app" class="">
        <!-- BANNER -->
        <div id="banner">
            <div class="pf-brand">
                <span class="pf-brand-text">PhotoForge <span>Studio</span></span>
            </div>
            <div class="banner-actions">
                <button class="banner-btn" id="pf-btn-save-local" title="Save to local storage"><i class="fa-solid fa-database"></i> Save Local</button>
                <button class="banner-btn" id="pf-btn-download-png" title="Download PNG"><i class="fa-solid fa-file-image"></i> PNG</button>
                <button class="banner-btn" id="pf-btn-download-jpeg" title="Download JPEG"><i class="fa-solid fa-file-image"></i> JPEG</button>
                <button class="banner-btn" id="pf-btn-download-webp" title="Download WebP"><i class="fa-solid fa-file-image"></i> WebP</button>
                <span class="banner-divider"></span>
                <button class="banner-btn-secondary" id="pf-btn-undo" title="Undo"><i class="fa-solid fa-undo"></i></button>
                <button class="banner-btn-secondary" id="pf-btn-redo" title="Redo"><i class="fa-solid fa-redo"></i></button>
                <button class="banner-btn-secondary" id="pf-btn-reset" title="Reset to original"><i class="fa-solid fa-rotate-left"></i></button>

                <button class="banner-btn-secondary" id="pf-btn-toggle-gallery" title="Toggle gallery"><i class="fa-solid fa-images"></i> Gallery</button>
            </div>
        </div>

        <!-- MENU BAR -->
        <div id="menu-bar">
            <button class="menu-btn" id="pf-btn-filter-rainbow"><i class="fa-solid fa-rainbow"></i> Rainbow</button>
            <button class="menu-btn" id="pf-btn-filter-sunset"><i class="fa-solid fa-sun"></i> Sunset</button>
            <button class="menu-btn" id="pf-btn-filter-prison"><i class="fa-solid fa-bars"></i> Prison</button>
            <button class="menu-btn" id="pf-btn-filter-crumble"><i class="fa-solid fa-burst"></i> Crumble</button>
            <span class="banner-divider"></span>
            <button class="menu-btn" id="pf-btn-bg-remove"><i class="fa-solid fa-eraser"></i> BG Remove</button>
            <button class="menu-btn" id="pf-btn-watermark"><i class="fa-solid fa-stamp"></i> Watermark</button>
            <button class="menu-btn" id="pf-btn-blur"><i class="fa-solid fa-user-shield"></i> Blur</button>
            <button class="menu-btn" id="pf-btn-html-img"><i class="fa-solid fa-code"></i> HTML→IMG</button>
        </div>

        <!-- LEFT PANEL -->
        <div id="left" class="closed">
            <h4>Adjustments</h4>
            <div class="pf-slider-group">
                <label>Exposure <span class="pf-slider-reset" data-reset="exposure" title="Reset"><i class="fa-solid fa-rotate-left"></i></span></label>
                <input type="range" id="pf-slider-exposure" min="-100" max="100" value="0" step="1">
                <span class="pf-slider-value" id="pf-slider-exposure-val">0</span>
            </div>
            <div class="pf-slider-group">
                <label>Saturation <span class="pf-slider-reset" data-reset="saturation" title="Reset"><i class="fa-solid fa-rotate-left"></i></span></label>
                <input type="range" id="pf-slider-saturation" min="0" max="200" value="100" step="1">
                <span class="pf-slider-value" id="pf-slider-saturation-val">100</span>
            </div>
            <div class="pf-slider-group">
                <label>Hue <span class="pf-slider-reset" data-reset="hue" title="Reset"><i class="fa-solid fa-rotate-left"></i></span></label>
                <input type="range" id="pf-slider-hue" min="0" max="360" value="0" step="1">
                <span class="pf-slider-value" id="pf-slider-hue-val">0°</span>
            </div>
            <div class="pf-slider-group">
                <label>Blur <span class="pf-slider-reset" data-reset="blur" title="Reset"><i class="fa-solid fa-rotate-left"></i></span></label>
                <input type="range" id="pf-slider-blur" min="0" max="20" value="0" step="0.5">
                <span class="pf-slider-value" id="pf-slider-blur-val">0</span>
            </div>
            <div class="pf-slider-group">
                <label>Opacity <span class="pf-slider-reset" data-reset="opacity" title="Reset"><i class="fa-solid fa-rotate-left"></i></span></label>
                <input type="range" id="pf-slider-opacity" min="0" max="100" value="100" step="1">
                <span class="pf-slider-value" id="pf-slider-opacity-val">100</span>
            </div>

            <h4 style="margin-top:12px;">Basic Tools</h4>
            <button class="action-tool" id="pf-btn-upload"><i class="fa-solid fa-upload"></i> Upload</button>
            <button class="action-tool" id="pf-btn-crop"><i class="fa-solid fa-crop"></i> Crop</button>
            <button class="action-tool" id="pf-btn-rotate"><i class="fa-solid fa-rotate"></i> Rotate</button>
            <button class="action-tool" id="pf-btn-resize"><i class="fa-solid fa-ruler"></i> Resize</button>
            <button class="action-tool" id="pf-btn-compress"><i class="fa-solid fa-compress"></i> Compress</button>
            <button class="action-tool" id="pf-btn-upscale"><i class="fa-solid fa-expand"></i> Upscale</button>
            <input type="file" class="pf-file-input" id="pf-file-input" accept="image/*">

        <!-- MIDDLE -->
        <div id="middle">
            <div class="pf-editor-wrapper" id="pf-editor-wrapper">
                <div id="tui-image-editor"></div>
                <div class="pf-toast" id="pf-toast"></div>
            </div>
            <div class="pf-loading" id="pf-loading">
                <div class="pf-spinner"></div>
                <div class="pf-loading-text">Loading PhotoForge Studio...</div>
                <div class="pf-loading-sub">Preparing your workspace</div>
            </div>
        </div>

        <!-- RIGHT PANEL - GALLERY -->
        <div id="right" class="closed">
            <h4>PhotoForge Studio Gallery</h4>
            <div id="local-gallery" class="gallery-section"></div>
        </div>

        <!-- LEFT TOGGLE BUTTON -->
        <button id="left-toggle-btn" title="Toggle Adjustments & Basic Tools">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- MODAL -->
        <div class="pf-modal-overlay" id="pf-modal">
            <div class="pf-modal-box">
                <button class="pf-modal-close-btn" id="pf-modal-close"><i class="fa-solid fa-times"></i></button>
                <div class="pf-modal-title" id="pf-modal-title">Title</div>
                <div class="pf-modal-body" id="pf-modal-body">Body</div>
                <div class="pf-modal-actions" id="pf-modal-actions"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================= DOM REFS =================
            const appEl = document.getElementById('pf-app');
            const editorWrapper = document.getElementById('pf-editor-wrapper');
            const editorEl = document.getElementById('tui-image-editor');
            const loadingOverlay = document.getElementById('pf-loading');
            const fileInput = document.getElementById('pf-file-input');
            const toastEl = document.getElementById('pf-toast');
            const modalOverlay = document.getElementById('pf-modal');
            const modalTitle = document.getElementById('pf-modal-title');
            const modalBody = document.getElementById('pf-modal-body');
            const modalActions = document.getElementById('pf-modal-actions');
            const modalClose = document.getElementById('pf-modal-close');
            const localGallery = document.getElementById('local-gallery');
            const leftPanel = document.getElementById('left');
            const rightPanel = document.getElementById('right');
            const leftToggleBtn = document.getElementById('left-toggle-btn');
            const btnToggleGallery = document.getElementById('pf-btn-toggle-gallery');

            const btnUpload = document.getElementById('pf-btn-upload');
            const btnUndo = document.getElementById('pf-btn-undo');
            const btnRedo = document.getElementById('pf-btn-redo');
            const btnReset = document.getElementById('pf-btn-reset');
            const btnDlPng = document.getElementById('pf-btn-download-png');
            const btnDlJpeg = document.getElementById('pf-btn-download-jpeg');
            const btnDlWebp = document.getElementById('pf-btn-download-webp');
            const btnCompress = document.getElementById('pf-btn-compress');
            const btnUpscale = document.getElementById('pf-btn-upscale');
            const btnBgRemove = document.getElementById('pf-btn-bg-remove');
            const btnWatermark = document.getElementById('pf-btn-watermark');
            const btnBlur = document.getElementById('pf-btn-blur');
            const btnHtmlImg = document.getElementById('pf-btn-html-img');
            const btnResize = document.getElementById('pf-btn-resize');
            const btnCrop = document.getElementById('pf-btn-crop');
            const btnRotate = document.getElementById('pf-btn-rotate');
            const btnFilterRainbow = document.getElementById('pf-btn-filter-rainbow');
            const btnFilterSunset = document.getElementById('pf-btn-filter-sunset');
            const btnFilterPrison = document.getElementById('pf-btn-filter-prison');
            const btnFilterCrumble = document.getElementById('pf-btn-filter-crumble');
            const btnSaveLocal = document.getElementById('pf-btn-save-local');

            const sliderExposure = document.getElementById('pf-slider-exposure');
            const sliderSaturation = document.getElementById('pf-slider-saturation');
            const sliderHue = document.getElementById('pf-slider-hue');
            const sliderBlur = document.getElementById('pf-slider-blur');
            const sliderOpacity = document.getElementById('pf-slider-opacity');
            const valExposure = document.getElementById('pf-slider-exposure-val');
            const valSaturation = document.getElementById('pf-slider-saturation-val');
            const valHue = document.getElementById('pf-slider-hue-val');
            const valBlur = document.getElementById('pf-slider-blur-val');
            const valOpacity = document.getElementById('pf-slider-opacity-val');

            // ================= STATE =================
            let imageEditor = null;
            let isReady = false;
            let toastTimeout = null;
            let originalDataURL = null;
            let blurModeActive = false;
            let blurStartPos = null;
            let filterState = { exposure: 0, saturation: 100, hue: 0, blur: 0, opacity: 100 };
            const historyStack = [];
            let historyIndex = -1;
            let isLeftPanelOpen = false;
            let isRightPanelOpen = false;
            let db = null;
            const DB_NAME = 'PhotoForgeDB';
            const DB_VERSION = 1;
            const STORE_NAME = 'images';
            const AUTO_SAVE_KEY = 'auto-save-current';
            let autoSaveTimer = null;
            let autoSaveTimerDebounce = null;

            // ================= UTILS =================
            function showToast(msg, duration) {
                duration = duration || 2000;
                if (toastTimeout) clearTimeout(toastTimeout);
                toastEl.textContent = msg;
                toastEl.classList.add('pf-show');
                toastTimeout = setTimeout(function() { toastEl.classList.remove('pf-show'); }, duration);
            }

            function showModal(title, bodyHTML, actionsHTML) {
                modalTitle.textContent = title;
                modalBody.innerHTML = bodyHTML;
                modalActions.innerHTML = actionsHTML || '';
                modalOverlay.classList.add('pf-active');
            }

            function closeModal() { modalOverlay.classList.remove('pf-active'); }

            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });

            // ================= PANEL TOGGLES =================
            function toggleLeftPanel(forceState) {
                if (typeof forceState === 'boolean') isLeftPanelOpen = forceState;
                else isLeftPanelOpen = !isLeftPanelOpen;
                if (isLeftPanelOpen) {
                    appEl.classList.add('left-open');
                    leftPanel.classList.remove('closed');
                    leftToggleBtn.classList.add('open');
                    leftToggleBtn.title = 'Hide Adjustments & Basic Tools';
                } else {
                    appEl.classList.remove('left-open');
                    leftPanel.classList.add('closed');
                    leftToggleBtn.classList.remove('open');
                    leftToggleBtn.title = 'Show Adjustments & Basic Tools';
                }
            }

            function toggleRightPanel(forceState) {
                if (typeof forceState === 'boolean') isRightPanelOpen = forceState;
                else isRightPanelOpen = !isRightPanelOpen;
                if (isRightPanelOpen) {
                    appEl.classList.add('right-open');
                    rightPanel.classList.remove('closed');
                    btnToggleGallery.style.borderColor = '#4da6cc';
                    btnToggleGallery.style.color = '#fff';
                } else {
                    appEl.classList.remove('right-open');
                    rightPanel.classList.add('closed');
                    btnToggleGallery.style.borderColor = '';
                    btnToggleGallery.style.color = '';
                }
            }

            leftToggleBtn.addEventListener('click', function() { toggleLeftPanel(); });
            btnToggleGallery.addEventListener('click', function() {
                toggleRightPanel();
                if (isRightPanelOpen) { updateGallery();
                    showToast('📂 Gallery shown'); } else { showToast('📁 Gallery hidden'); }
            });

            // Start with left panel open on desktop for discoverability
            if (window.innerWidth > 800) {
                setTimeout(function() { toggleLeftPanel(true); }, 800);
            }

            // ================= INDEXEDDB =================
            function openDB() {
                return new Promise(function(resolve, reject) {
                    var req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = function(e) {
                        db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            var store = db.createObjectStore(STORE_NAME, { keyPath: 'id',
                                autoIncrement: true });
                            store.createIndex('autoSaveKey', 'autoSaveKey', { unique: false });
                        }
                    };
                    req.onsuccess = function(e) { db = e.target.result;
                        resolve(db); };
                    req.onerror = function(e) { reject(e); };
                });
            }

            function saveImageToDB(dataURL, name, autoSaveKey) {
                autoSaveKey = autoSaveKey || null;
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readwrite');
                    var store = tx.objectStore(STORE_NAME);
                    var item = { dataURL: dataURL, name: name, date: new Date().toISOString() };
                    if (autoSaveKey) {
                        item.autoSaveKey = autoSaveKey;
                        var index = store.index('autoSaveKey');
                        var getReq = index.get(autoSaveKey);
                        getReq.onsuccess = function() {
                            if (getReq.result) { item.id = getReq.result.id;
                                store.put(item); } else { store.add(item); }
                            resolve();
                        };
                        getReq.onerror = function() { reject(getReq.error); };
                    } else {
                        var req = store.add(item);
                        req.onsuccess = function() { resolve(req.result); };
                        req.onerror = function(e) { reject(e); };
                    }
                });
            }

            function getAutoSave() {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readonly');
                    var store = tx.objectStore(STORE_NAME);
                    var index = store.index('autoSaveKey');
                    var req = index.get(AUTO_SAVE_KEY);
                    req.onsuccess = function() { resolve(req.result || null); };
                    req.onerror = function() { reject(req.error); };
                });
            }

            function getAllImages() {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readonly');
                    var store = tx.objectStore(STORE_NAME);
                    var req = store.getAll();
                    req.onsuccess = function() { resolve(req.result); };
                    req.onerror = function(e) { reject(e); };
                });
            }

            function deleteImageFromDB(id) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readwrite');
                    var store = tx.objectStore(STORE_NAME);
                    var req = store.delete(id);
                    req.onsuccess = function() { resolve(); };
                    req.onerror = function(e) { reject(e); };
                });
            }

            function updateGallery() {
                getAllImages().then(function(images) {
                    images = images.filter(function(img) { return !img.autoSaveKey; });
                    localGallery.innerHTML = '';
                    if (images.length === 0) {
                        localGallery.innerHTML =
                            '<p style="color:var(--text-muted);font-size:0.62rem;text-align:center;padding:12px;">No saved images yet.<br>Use "Save Local" to store images here.</p>';
                        return;
                    }
                    images.forEach(function(img) {
                        var div = document.createElement('div');
                        div.className = 'gallery-item';
                        div.innerHTML = '<img src="' + img.dataURL + '" alt="' + (img.name || '') +
                            '">' +
                            '<div class="gallery-item-info" title="' + (img.name || '') + '">' + (img
                                .name || '') + '</div>' +
                            '<div class="gallery-item-actions">' +
                            '<button title="Load" data-id="' + img.id +
                            '" data-action="load"><i class="fa-solid fa-folder-open"></i></button>' +
                            '<button title="Delete" data-id="' + img.id +
                            '" data-action="delete"><i class="fa-solid fa-trash"></i></button>' +
                            '</div>';
                        localGallery.appendChild(div);
                    });
                    var actionButtons = localGallery.querySelectorAll('.gallery-item-actions button');
                    actionButtons.forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var action = this.getAttribute('data-action');
                            var id = parseInt(this.getAttribute('data-id'), 10);
                            if (action === 'load') {
                                var img = images.find(function(i) { return i.id === id; });
                                if (img) {
                                    loadImageToEditor(img.dataURL, img.name || 'Loaded')
                                        .then(function() { showToast('📁 Loaded from local'); })
                                        .catch(function() { showToast('⚠️ Failed to load'); });
                                }
                            } else if (action === 'delete') {
                                deleteImageFromDB(id).then(function() {
                                    updateGallery();
                                    showToast('🗑️ Deleted');
                                });
                            }
                        });
                    });
                }).catch(function(e) { console.error(e); });
            }

            // ================= AUTO-SAVE =================
            function autoSave() {
                if (!isReady) return;
                var dataURL = getDataURL('png', 1.0);
                if (!dataURL) return;
                saveImageToDB(dataURL, 'Auto-Saved', AUTO_SAVE_KEY).catch(function(e) { console.warn(
                        'Auto-save failed', e); });
            }

            function startAutoSave(interval) {
                interval = interval || 10000;
                if (autoSaveTimer) clearInterval(autoSaveTimer);
                autoSaveTimer = setInterval(autoSave, interval);
            }

            // ================= TUI INIT =================
            var darkThemeConfig = {
                'common.backgroundColor': '#0a0a14',
                'common.border': '1px solid rgba(26,82,118,0.35)',
                'header.backgroundColor': '#0a1628',
                'header.display': 'none',
                'loadButton.display': 'none',
                'downloadButton.display': 'none',
                'menu.backgroundColor': '#000000',
                'menu.border': '1px solid rgba(26,82,118,0.3)',
                'menu.color': '#d0d0d0',
                'menu.fontFamily': 'Inter, Segoe UI, Arial, sans-serif',
                'menu.fontSize': '13px',
                'menu.normalIcon.color': '#aaa',
                'menu.activeIcon.color': '#1a5276',
                'menu.disabledIcon.color': '#444',
                'menu.hoverIcon.color': '#fff',
                'submenu.backgroundColor': '#0a1628',
                'submenu.border': '1px solid rgba(26,82,118,0.35)',
                'submenu.color': '#ccc',
                'submenu.fontFamily': 'Inter, Segoe UI, Arial, sans-serif',
                'submenu.fontSize': '12px',
                'submenu.normalIcon.color': '#aaa',
                'submenu.activeIcon.color': '#1a5276',
                'checkbox.border': '1px solid rgba(26,82,118,0.5)',
                'checkbox.backgroundColor': 'transparent',
                'range.pointerColor': '#1a5276',
                'range.barColor': '#1a5276',
                'range.subbarColor': '#333',
                'range.valueColor': '#fff',
                'range.valueFontSize': '11px',
                'range.valueFontWeight': 'bold',
                'range.valueFontFamily': 'Inter, Segoe UI, Arial, sans-serif',
            };

            function initEditor() {
                try {
                    imageEditor = new tui.ImageEditor(editorEl, {
                        includeUI: {
                            loadImage: {
                                path: 'https://picsum.photos/id/1018/1200/800',
                                name: 'DemoImage',
                            },
                            theme: darkThemeConfig,
                            menu: ['resize', 'crop', 'flip', 'rotate', 'draw', 'shape', 'icon', 'text',
                                'mask', 'filter'
                            ],
                            initMenu: 'filter',
                            uiSize: { width: '100%', height: '100%' },
                            menuBarPosition: 'bottom',
                        },
                        cssMaxWidth: 0,
                        cssMaxHeight: 0,
                        selectionStyle: {
                            cornerSize: 18,
                            rotatingPointOffset: 65,
                            borderColor: '#1a5276',
                            cornerColor: '#ffffff',
                            cornerStrokeColor: '#1a5276',
                            transparentCorners: false,
                            lineWidth: 2,
                            borderDashArray: [5, 3],
                        },
                        usageStatistics: false,
                    });

                    isReady = true;
                    window.imageEditor = imageEditor;

                    var events = ['addText', 'objectAdded', 'objectModified', 'objectMoved', 'objectScaled',
                        'objectRotated', 'addShape', 'addIcon', 'addImage', 'deleteObject', 'clearObjects',
                        'flip', 'rotation', 'resize', 'crop', 'filter'
                    ];

                    });

                    setTimeout(function() {

                        });

                        if (loadingOverlay) loadingOverlay.classList.add('pf-hidden');

            // ================= HISTORY =================
            function pushHistory() {
                if (!isReady) return;
                var dataURL = getDataURL('png', 1.0);
                if (!dataURL) return;
                if (historyIndex < historyStack.length - 1) {
                    historyStack.splice(historyIndex + 1);
                }
                historyStack.push(dataURL);
                historyIndex = historyStack.length - 1;
            }

            function performUndo() {
                if (!isReady || historyIndex <= 0) return;
                historyIndex--;
                var dataURL = historyStack[historyIndex];
                loadImageToEditor(dataURL, 'Undo')
                    .then(function() { showToast('↩️ Undone'); })
                    .catch(function() { showToast('⚠️ Undo failed'); });
            }

            function performRedo() {
                if (!isReady || historyIndex >= historyStack.length - 1) return;
                historyIndex++;
                var dataURL = historyStack[historyIndex];
                loadImageToEditor(dataURL, 'Redo')
                    .then(function() { showToast('↪️ Redone'); })
                    .catch(function() { showToast('⚠️ Redo failed'); });
            }

            // ================= IMAGE HELPERS =================
            function getDataURL(format, quality) {
                quality = quality || 0.92;
                if (!imageEditor || !isReady) return null;
                try { return imageEditor.toDataURL({ format: format, quality: quality }); } catch (e) { return null; }
            }

            function getImageObject() {
                return new Promise(function(resolve, reject) {
                    var dataURL = getDataURL('png', 1.0);
                    if (!dataURL) { reject(new Error('No image data'));
                        return; }
                    var img = new Image();
                    img.onload = function() { resolve(img); };
                    img.onerror = function() { reject(new Error('Failed to load image')); };
                    img.src = dataURL;
                });
            }

            function loadImageToEditor(dataURL, name) {
                name = name || 'EditedImage';
                if (!imageEditor || !isReady) { showToast('⚠️ Editor not ready'); return Promise.reject(new Error(
                        'Not ready')); }
                try {
                    var result = imageEditor.loadImageFromURL(dataURL, name);
                    if (result && typeof result.then === 'function') {
                        return result.then(function() { pushHistory(); return true; });
                    }
                    pushHistory();
                    return Promise.resolve(true);
                } catch (err) { return Promise.reject(err); }
            }

            // ================= DOWNLOAD =================
            function downloadImage(format) {
                format = format || 'png';
                if (!isReady) { showToast('⚠️ Editor not ready'); return; }
                try {
                    var quality = (format === 'jpeg' || format === 'webp') ? 0.92 : 1.0;
                    var dataURL = getDataURL(format, quality);
                    if (!dataURL) { showToast('⚠️ Failed to export'); return; }
                    var link = document.createElement('a');
                    link.href = dataURL;
                    link.download = 'photoforge-' + Date.now() + '.' + format;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast('📥 Downloaded ' + format.toUpperCase());
                } catch (err) { showToast('⚠️ Download failed'); }
            }

            // ================= FILTER STATE =================
            function applyFilterState() {
                var canvas = document.querySelector('#tui-image-editor canvas.lower-canvas');
                if (!canvas) return;
                var filters = [];
                if (filterState.exposure !== 0) filters.push('brightness(' + (1 + filterState.exposure / 200) +
                    ')');
                if (filterState.saturation !== 100) filters.push('saturate(' + (filterState.saturation / 100) +
                    ')');
                if (filterState.hue !== 0) filters.push('hue-rotate(' + filterState.hue + 'deg)');
                if (filterState.blur > 0) filters.push('blur(' + filterState.blur + 'px)');
                if (filterState.opacity < 100) filters.push('opacity(' + (filterState.opacity / 100) + ')');
                canvas.style.filter = filters.length > 0 ? filters.join(' ') : 'none';
            }

            function updateSliderDisplay() {

            // ================= CUSTOM FILTERS =================
            function applyCanvasFilter(filterType) {
                if (!isReady) { showToast('⚠️ Not ready'); return; }
                getImageObject().then(function(img) {
                    var canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    var data = imageData.data;
                    switch (filterType) {
                        case 'rainbow':
                            for (var i = 0; i < data.length; i += 4) {
                                var avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                                var section = i / data.length;
                                if (section < 1 / 7) {
                                    data[i] = avg < 128 ? 2 * avg : 255;
                                    data[i + 1] = avg < 128 ? 0 : (2 * avg) - 255;
                                    data[i + 2] = avg < 128 ? 0 : (2 * avg) - 255;
                                } else if (section < 2 / 7) {
                                    data[i] = avg < 128 ? 2 * avg : 255;
                                    data[i + 1] = avg < 128 ? 0.8 * avg : (1.2 * avg) - 51;
                                    data[i + 2] = avg < 128 ? 0 : (2 * avg) - 255;
                                } else if (section < 3 / 7) {
                                    data[i] = avg < 128 ? 2 * avg : 255;
                                    data[i + 1] = avg < 128 ? 2 * avg : 255;
                                    data[i + 2] = avg < 128 ? 0 : (2 * avg) - 255;
                                } else if (section < 4 / 7) {
                                    data[i] = avg < 128 ? 0 : (2 * avg) - 255;
                                    data[i + 1] = avg < 128 ? 2 * avg : 255;
                                    data[i + 2] = avg < 128 ? 0 : (2 * avg) - 255;
                                } else if (section < 5 / 7) {
                                    data[i] = avg < 128 ? 0 : (2 * avg) - 255;
                                    data[i + 1] = avg < 128 ? 0 : (2 * avg) - 255;
                                    data[i + 2] = avg < 128 ? 2 * avg : 255;
                                } else if (section < 6 / 7) {
                                    data[i] = avg < 128 ? 0.8 * avg : (1.2 * avg) - 51;
                                    data[i + 1] = avg < 128 ? 0 : (2 * avg) - 255;
                                    data[i + 2] = avg < 128 ? 2 * avg : 255;
                                } else {
                                    data[i] = avg < 128 ? 1.6 * avg : (0.4 * avg) + 153;
                                    data[i + 1] = avg < 128 ? 0 : (2 * avg) - 255;
                                    data[i + 2] = avg < 128 ? 1.6 * avg : (0.4 * avg) + 153;
                                }
                            }
                            break;
                        case 'sunset':
                            for (var j = 0; j < data.length; j += 4) { data[j] = 255; }
                            break;
                        case 'prison':
                            for (var k = 0; k < data.length; k += 4) {
                                var sec2 = k / data.length;
                                var inBar = (sec2 % (1 / 6)) < (1 / 6) * 0.15;
                                if (inBar) { data[k] = 0;
                                    data[k + 1] = 0;
                                    data[k + 2] = 0; }
                            }
                            break;
                        case 'crumble':
                            for (var m = 0; m < data.length; m += 4) {
                                if (Math.random() > 0.5) {
                                    var p = m + 4;
                                    if (p < data.length) { data[p] = data[m];
                                        data[p + 1] = data[m + 1];
                                        data[p + 2] = data[m + 2]; }
                                }
                            }
                            break;
                        default:
                            return;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    var resultURL = canvas.toDataURL('image/png');
                    loadImageToEditor(resultURL, filterType.charAt(0).toUpperCase() + filterType.slice(1))
                        .then(function() {
                            showToast('🎨 Filter applied');
                            pushHistory();
                            autoSave();
                        });
                }).catch(function(err) { console.error(err);
                    showToast('⚠️ Filter failed'); });
            }

            // ================= BG REMOVE =================
            function removeBackground() {
                if (!isReady) { showToast('⚠️ Not ready'); return; }
                showModal('Remove Background',
                    '<p style="font-size:0.7rem;">Works best with solid backgrounds.</p>' +
                    '<div style="margin:12px 0;"><label style="font-size:0.62rem;color:#aaa;">Tolerance: <span id="pf-bg-tol-val">30</span></label>' +
                    '<input type="range" class="pf-modal-range" id="pf-bg-tol" min="5" max="80" value="30"></div>',
                    '<button class="pf-btn pf-btn-primary" id="pf-bg-apply"><i class="fa-solid fa-eraser"></i> Remove</button>' +
                    '<button class="pf-btn pf-btn-secondary" id="pf-bg-cancel">Cancel</button>'
                );
                var tol = document.getElementById('pf-bg-tol');
                var tolVal = document.getElementById('pf-bg-tol-val');
                if (tol && tolVal) tol.addEventListener('input', function() { tolVal.textContent = tol.value; });
                document.getElementById('pf-bg-apply').addEventListener('click', function() {
                    var tolerance = parseInt(tol.value, 10);
                    closeModal();
                    getImageObject().then(function(img) {
                        var canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        var data = imageData.data;
                        var corners = [
                            { x: 2, y: 2 }, { x: canvas.width - 3, y: 2 },
                            { x: 2, y: canvas.height - 3 }, { x: canvas.width - 3, y: canvas.height - 3 }
                        ];
                        var bgR = 0,
                            bgG = 0,
                            bgB = 0;
                        corners.forEach(function(c) {
                            var idx = (c.y * canvas.width + c.x) * 4;
                            bgR += data[idx];
                            bgG += data[idx + 1];
                            bgB += data[idx + 2];
                        });
                        bgR = Math.round(bgR / 4);
                        bgG = Math.round(bgG / 4);
                        bgB = Math.round(bgB / 4);
                        var threshold = tolerance * 2.55;
                        for (var i = 0; i < data.length; i += 4) {
                            var diff = Math.abs(data[i] - bgR) + Math.abs(data[i + 1] - bgG) + Math.abs(data[
                                i + 2] - bgB);
                            if (diff < threshold * 3) data[i + 3] = 0;
                        }
                        ctx.putImageData(imageData, 0, 0);
                        return loadImageToEditor(canvas.toDataURL('image/png'), 'BGRemoved');
                    }).then(function() {
                        showToast('🎯 Background removed');
                        pushHistory();
                        autoSave();
                    }).catch(function() { showToast('⚠️ Failed'); });
                });
                document.getElementById('pf-bg-cancel').addEventListener('click', closeModal);
            }
