<!DOCTYPE html>
<html b:version='2' class='v2' expr:dir='data:blog.languageDirection' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
    <meta charset='UTF-8' />
    <meta content='width=device-width, initial-scale=1.0' name='viewport' />
    <title><data:blog.pageTitle />HEXAI-All-in-One</title>
    <b:include data='blog' name='all-head-content' />

    <b:skin><![CDATA[
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }
        .post {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .post-title {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .post-title a {
            color: #fff;
        }
        .post-body {
            font-size: 15px;
            line-height: 1.7;
            color: #ddd;
        }
    ]]></b:skin>

    <style>
        /* ============================================================
           ENHANCED MATRIX ANIMATION CSS
           Based on upgraded matrix-animation styles
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --matrix-green: #00ff41;
            --matrix-dark-green: #003b00;
            --matrix-glow: rgba(0, 255, 65, 0.6);
            --matrix-trail: rgba(0, 0, 0, 0.05);
            --matrix-speed: 1.0;
            --matrix-font-size: 16px;
            --matrix-hue: 120;
            --loader-bg: rgba(0, 0, 0, 0.92);
            --blog-bg: rgba(0, 0, 0, 0.35);
            --terminal-bg: rgba(0, 0, 0, 0.85);
            --rainbow-speed: 3s;
        }

        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            overflow-x: hidden;
            min-height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            position: relative;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* ============================================================
           MATRIX CANVAS LAYERS (Background)
           ============================================================ */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            background: #000;
            pointer-events: none;
            transition: opacity 0.5s ease, background-color 0.5s ease;
        }

        #matrixCanvasBack {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            background: transparent;
            pointer-events: none;
            opacity: 0.4;
            transition: opacity 0.5s ease;
        }

        #matrixCanvasGlow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            background: transparent;
            pointer-events: none;
            opacity: 0.25;
            filter: blur(8px);
            transition: opacity 0.5s ease;
        }

        /* ============================================================
           LOADER WRAPPER
           ============================================================ */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--loader-bg);
            z-index: 1000;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #loader-wrapper.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Logo Container with enhanced glow rings */
        .logo-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: filter 0.3s ease;
            user-select: none;
        }

        .logo-container.touched {
            filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.8)) drop-shadow(0 0 40px rgba(0, 255, 0, 0.5)) drop-shadow(0 0 60px rgba(0, 0, 255, 0.4));
            animation: rainbowGlow 2s infinite linear;
        }

        @keyframes rainbowGlow {
            0% {
                filter: drop-shadow(0 0 20px #ff0000) drop-shadow(0 0 40px #00ff00) drop-shadow(0 0 60px #0000ff);
            }
            25% {
                filter: drop-shadow(0 0 20px #ff00ff) drop-shadow(0 0 40px #00ffff) drop-shadow(0 0 60px #ffff00);
            }
            50% {
                filter: drop-shadow(0 0 20px #00ff00) drop-shadow(0 0 40px #0000ff) drop-shadow(0 0 60px #ff0000);
            }
            75% {
                filter: drop-shadow(0 0 20px #0000ff) drop-shadow(0 0 40px #ff0000) drop-shadow(0 0 60px #00ff00);
            }
            100% {
                filter: drop-shadow(0 0 20px #ff0000) drop-shadow(0 0 40px #00ff00) drop-shadow(0 0 60px #0000ff);
            }
        }

        .logo-img {
            width: 170px;
            height: 170px;
            z-index: 2;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.9));
            animation: pulse 2s infinite ease-in-out;
            border-radius: 50%;
            background: transparent;
            transition: transform 0.2s ease;
        }

        .logo-container:active .logo-img {
            transform: scale(0.95);
        }

        .ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top: 3px solid #ff0000;
            border-right: 3px solid #ff0000;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
            pointer-events: none;
        }

        .ring2 {
            position: absolute;
            top: 12px;
            left: 12px;
            width: calc(100% - 24px);
            height: calc(100% - 24px);
            border: 2px solid transparent;
            border-bottom: 2px solid #8b0000;
            border-left: 2px solid #8b0000;
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
            pointer-events: none;
        }

        .ring3 {
            position: absolute;
            top: 24px;
            left: 24px;
            width: calc(100% - 48px);
            height: calc(100% - 48px);
            border: 1px solid transparent;
            border-top: 1px solid #ff4444;
            border-bottom: 1px solid #ff4444;
            border-radius: 50%;
            animation: spin 3s linear infinite;
            opacity: 0.5;
            pointer-events: none;
        }

        /* Loading Bar */
        .loading-bar-container {
            width: 280px;
            height: 6px;
            background: #1a1a1a;
            margin-top: 35px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 1px 3px rgba(255, 255, 255, 0.1);
            border: 1px solid #222;
            position: relative;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0000, #ff4444, #8b0000, #ff0000);
            background-size: 200% 100%;
            border-radius: 20px;
            transition: width 0.25s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
            animation: barShimmer 1.5s linear infinite;
        }

        @keyframes barShimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        .status-text {
            margin-top: 20px;
            color: #ff3333;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: blink 0.8s infinite alternate;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            transition: color 0.3s ease;
        }

        .status-text.success {
            color: #00ff41;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.7);
            animation: none;
        }

        .click-hint {
            color: #ff6666;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 1px;
            opacity: 0.9;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.7));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 30px rgba(255, 0, 0, 1));
            }
        }
        @keyframes blink {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0.4;
            }
        }

        /* ============================================================
           BLOG CONTENT
           ============================================================ */
        #blog-content {
            display: none;
            position: relative;
            z-index: 1;
            width: 100%;
            margin: 0 auto;
            padding: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .blog-container {
            background: var(--blog-bg);
            border-radius: 0;
            border: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            margin: 0;
            box-shadow: none;
            width: 100%;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            transition: background 0.5s ease;
        }

        .blog-header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .blog-title {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            margin-bottom: 5px;
            animation: rainbowTextGradient 6s ease infinite;
        }

        @keyframes rainbowTextGradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .blog-description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .blog-main {
            padding: 20px 0;
        }

        /* ============================================================
           HEX AI TERMINAL FEED - RAINBOW THEME
           ============================================================ */
        .termux-chat {
            background: linear-gradient(135deg,
                    rgba(255, 0, 0, 0.08),
                    rgba(255, 165, 0, 0.08),
                    rgba(255, 255, 0, 0.08),
                    rgba(0, 255, 0, 0.08),
                    rgba(0, 0, 255, 0.08),
                    rgba(255, 0, 255, 0.08));
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 100%;
            width: 100%;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3), 0 0 40px rgba(0, 255, 0, 0.2), 0 0 60px rgba(0, 0, 255, 0.1);
            color: #00ff00;
            position: relative;
            overflow: hidden;
            animation: rainbowBorder 3s linear infinite;
            transition: background 0.5s ease, color 0.5s ease;
        }

        @keyframes rainbowBorder {
            0% {
                border-color: #ff0000;
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            }
            17% {
                border-color: #ff8800;
                box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
            }
            33% {
                border-color: #ffff00;
                box-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
            }
            50% {
                border-color: #00ff00;
                box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            }
            67% {
                border-color: #0000ff;
                box-shadow: 0 0 20px rgba(0, 0, 255, 0.5);
            }
            83% {
                border-color: #ff00ff;
                box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            }
            100% {
                border-color: #ff0000;
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            }
        }

        .termux-chat::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(transparent 50%, rgba(255, 255, 255, 0.02) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
        }

        .termux-chat::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .termux-header {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border-bottom: 1px dashed #fff;
            padding-bottom: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0000ff, #ff00ff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowTextGradient 3s linear infinite;
            transition: color 0.5s ease;
        }

        .termux-header .terminal-buttons {
            display: flex;
            gap: 8px;
            -webkit-text-fill-color: initial;
        }

        .termux-header .terminal-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            animation: buttonPulse 2s infinite;
            -webkit-text-fill-color: initial;
        }

        .terminal-btn.red {
            background: #ff5f56;
            animation-delay: 0s;
        }
        .terminal-btn.yellow {
            background: #ffbd2e;
            animation-delay: 0.33s;
        }
        .terminal-btn.green {
            background: #27c93f;
            animation-delay: 0.66s;
        }

        @keyframes buttonPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .termux-chat-log {
            height: 500px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
            scroll-behavior: smooth;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.5s ease, color 0.5s ease;
        }

        .termux-chat-log::-webkit-scrollbar {
            width: 8px;
        }
        .termux-chat-log::-webkit-scrollbar-track {
            background: #000;
        }
        .termux-chat-log::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff0000, #00ff00, #0000ff);
            border-radius: 4px;
        }

        .termux-chat-log .bot {
            color: #00ff00;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
            word-break: break-word;
        }

        .termux-chat-log .system {
            color: #fff;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0000ff, #ff00ff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowTextGradient 3s linear infinite;
            font-weight: bold;
        }

        .termux-chat-log .error {
            color: #ff4444;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        .termux-chat-log a {
            color: #ffff00;
            text-decoration: underline;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 255, 0, 0.5);
            transition: color 0.3s ease;
        }
        .termux-chat-log a:hover {
            color: #ffaa00;
        }

        .termux-chat-log img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border-radius: 6px;
            border: 2px solid transparent;
            animation: rainbowBorder 3s linear infinite;
            display: block;
        }

        .termux-chat-log video {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border-radius: 6px;
            border: 2px solid transparent;
            animation: rainbowBorder 3s linear infinite;
            display: block;
        }

        .termux-chat-log .timestamp {
            color: #888;
            font-size: 12px;
            margin-right: 8px;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
            -webkit-text-fill-color: #888;
        }

        .termux-loader {
            display: none;
            text-align: center;
            margin: 10px 0;
            color: #fff;
            font-size: 14px;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0000ff, #ff00ff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowTextGradient 3s linear infinite;
        }

        .termux-btn {
            display: inline-block;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0000ff, #ff00ff);
            background-size: 300% 100%;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: rainbowButton 3s linear infinite;
        }

        @keyframes rainbowButton {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .termux-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 5px 25px rgba(255, 255, 255, 0.5);
            color: #fff;
        }

        .termux-btn:active {
            transform: translateY(0) scale(0.95);
        }

        .open-blog-btn {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: none;
            border: 2px solid;
            border-image: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0000ff, #ff00ff) 1;
            transition: all 0.3s ease;
            margin: 5px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .open-blog-btn:hover {
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0000ff, #ff00ff);
            background-size: 300% 100%;
            animation: rainbowButton 3s linear infinite;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .button-container {
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 10px 0;
        }

        /* ============================================================
           SYSTEM BACKGROUND THEME OPTIONS (new)
           ============================================================ */
        .system-theme-options {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin: 15px auto;
            max-width: 600px;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(5px);
            transition: background 0.5s ease;
        }

        .system-theme-options h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0000ff, #ff00ff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowTextGradient 3s linear infinite;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .option-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .option-item label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .option-item input[type="range"] {
            width: 100%;
            background: #222;
            height: 6px;
            border-radius: 3px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        .option-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0000, #00ff00);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }

        .option-item select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 6px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
        }

        .option-item select option {
            background: #111;
            color: #fff;
        }

        .option-item input[type="color"] {
            width: 100%;
            height: 35px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #222;
            cursor: pointer;
            padding: 2px;
        }

        .option-item input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .option-item input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 3px;
        }

        .option-item input[type="checkbox"] {

        .matrix-reset-btn {

        /* ============================================================
           MATRIX OPTIONS SECTION (existing, placed after system theme)
           ============================================================ */

            background: rgba(0, 0, 0, 0.6);

            background-size: 300% 100%;

            -webkit-text-fill-color: transparent;

        /* Terminal matrix canvas container */

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
            border-radius: 10px;
            overflow: hidden;

        .terminal-matrix-container canvas {
            width: 100%;

        /* Ensure other terminal content stays above */

        .termux-chat-log,
        .termux-loader,
        .button-container,
        .system-theme-options,
        .matrix-options {

        /* ============================================================

        /* ============================================================

                        <button class='matrix-reset-btn' id='matrixResetBtn'>Reset Defaults</button>
                    </div>
                </div>
            </div>

            <script>
                //<![CDATA[
                (function() {
                    var chatLog = document.getElementById('chatLog');
                    var loader = document.getElementById('loader');
                    var retryBtn = document.getElementById('retryBtn');

                    function getTimestamp() {
                        var now = new Date();
                        var hours = now.getHours().toString().padStart(2, '0');
                        var minutes = now.getMinutes().toString().padStart(2, '0');
                        var seconds = now.getSeconds().toString().padStart(2, '0');
                        return '[' + hours + ':' + minutes + ':' + seconds + ']';
                    }

                    function typeEffect(text, callback, className) {
                        var i = 0;
                        var container = document.createElement('div');
                        container.className = className || 'bot';
                        var timestamp = document.createElement('span');
                        timestamp.className = 'timestamp';
                        timestamp.textContent = getTimestamp();
                        container.appendChild(timestamp);
                        var textSpan = document.createElement('span');
                        container.appendChild(textSpan);
                        chatLog.appendChild(container);
                        var interval = setInterval(function() {
                            textSpan.innerHTML += text.charAt(i) === ' ' ? '&nbsp;' : text.charAt(i);
                            i++;
                            chatLog.scrollTop = chatLog.scrollHeight;
                            if (i >= text.length) {
                                clearInterval(interval);
                                if (callback) callback();
                            }
                        }, 20);
                    }

                    function appendMedia(mediaHtml) {
                        var container = document.createElement('div');
                        container.className = 'bot';
                        var timestamp = document.createElement('span');
                        timestamp.className = 'timestamp';
                        timestamp.textContent = getTimestamp();
                        container.appendChild(timestamp);
                        var mediaContainer = document.createElement('div');
                        mediaContainer.innerHTML = mediaHtml;
                        container.appendChild(mediaContainer);
                        chatLog.appendChild(container);
                        chatLog.scrollTop = chatLog.scrollHeight;
                    }

                    function appendSystemMessage(text) {
                        var container = document.createElement('div');
                        container.className = 'system';
                        var timestamp = document.createElement('span');
                        timestamp.className = 'timestamp';
                        timestamp.textContent = getTimestamp();
                        container.appendChild(timestamp);
                        var textSpan = document.createElement('span');
                        textSpan.textContent = text;
                        container.appendChild(textSpan);
                        chatLog.appendChild(container);
                        chatLog.scrollTop = chatLog.scrollHeight;
                    }

                    function appendErrorMessage(text) {
                        var container = document.createElement('div');
                        container.className = 'error';
                        var timestamp = document.createElement('span');
                        timestamp.className = 'timestamp';
                        timestamp.textContent = getTimestamp();
                        container.appendChild(timestamp);
                        var textSpan = document.createElement('span');
                        textSpan.textContent = text;
                        container.appendChild(textSpan);
                        chatLog.appendChild(container);
                        chatLog.scrollTop = chatLog.scrollHeight;
                    }

                    function loadingIndicator(label, duration, callback) {
                        loader.style.display = 'block';
                        var spin = ['|', '/', '-', '\\'];
                        var i = 0;
                        var spinInt = setInterval(function() {
                            loader.innerText = getTimestamp() + ' ' + label + ' ' + spin[i % 4];
                            i++;
                        }, 150);
                        setTimeout(function() {
                            clearInterval(spinInt);
                            loader.style.display = 'none';
                            if (callback) callback();
                        }, duration * 1000);
                    }

                    function fetchWithTimeout(url, options, timeout) {
                        timeout = timeout || 10000;
                        return new Promise(function(resolve, reject) {
                            var controller = new AbortController();
                            var id = setTimeout(function() { controller.abort(); }, timeout);
                            fetch(url, Object.assign({}, options, { signal: controller.signal }))
                                .then(function(response) { clearTimeout(id);
                                    resolve(response); })
                                .catch(function(error) { clearTimeout(id);
                                    reject(error); });
                        });
                    }

                    var apiKey = 'h4gmdo4jx8hy0vzis6xwrf95fge5akriabcha10j';
                    var feedUrl = 'https://hexaiallinone.blogspot.com/feeds/posts/default';
                    var blogUrl = 'https://hexaiallinone.blogspot.com';

                    function getMediaHtml(item) {
                        var imgUrl = '';
                        if (item.thumbnail) imgUrl = item.thumbnail;
                        else if (item.enclosure && item.enclosure.type && item.enclosure.type.indexOf('image') === 0)
                            imgUrl = item.enclosure.url;
                        else if (item.media) imgUrl = item.media;
                        if (!imgUrl && item.content) {
                            var match = item.content.match(/<img[^>]+src="([^">]+)"/);
                            if (match) imgUrl = match[1];
                        }
                        var videoUrl = '';
                        if (item.enclosure && item.enclosure.type && item.enclosure.type.indexOf('video') === 0)
                            videoUrl = item.enclosure.url;
                        if (!videoUrl && item.content) {
                            var vmatch = item.content.match(/<video[^>]+src="([^">]+)"/);
                            if (vmatch) videoUrl = vmatch[1];
                        }
                        var html = '';
                        if (imgUrl) html += '<img src="' + imgUrl + '" alt="post media" loading="lazy" />';
                        if (videoUrl) html += '<video src="' + videoUrl + '" controls preload="metadata"></video>';
                        return html;
                    }

                    function processFeedItems(items) {
                        if (!items || items.length === 0) {
                            appendSystemMessage('[INFO] No posts available at this time');
                            return;
                        }
                        appendSystemMessage('[SUCCESS] Feed loaded successfully!');
                        typeEffect("Showing latest posts:\n\n");
                        var count = Math.min(items.length, 10);

                        function processNextPost(index) {
                            if (index >= count) {
                                typeEffect("\n[COMPLETE] All posts loaded. Use the buttons below to navigate.\n", null,
                                    'system');
                                return;
                            }
                            var item = items[index];
                            var title = item.title || 'Untitled';
                            var link = item.link || '#';
                            var published = item.pubDate ? item.pubDate.substring(0, 10) : 'Unknown date';
                            typeEffect("▸ " + title + "\n", function() {
                                appendSystemMessage("Published: " + published);
                                if (link !== '#') {
                                    var linkContainer = document.createElement('div');
                                    linkContainer.className = 'bot';
                                    var linkSpan = document.createElement('span');
                                    linkSpan.innerHTML = '↳ <a href="' + link +
                                        '" target="_blank">Read Full Post</a>';
                                    linkContainer.appendChild(linkSpan);
                                    chatLog.appendChild(linkContainer);
                                    chatLog.scrollTop = chatLog.scrollHeight;
                                }
                                var mediaHtml = getMediaHtml(item);
                                if (mediaHtml) {
                                    appendMedia(mediaHtml);
                                }
                                if (index < count - 1) {
                                    typeEffect("\n", function() {
                                        setTimeout(function() {
                                            processNextPost(index + 1);
                                        }, 400);
                                    });
                                } else {
                                    typeEffect(
                                        "\n[COMPLETE] All posts loaded. Use the buttons below to navigate.\n",
                                        null, 'system');
                                }
                            }, 'bot');
                        }
                        processNextPost(0);
                    }

                    function fetchFeed() {
                        appendSystemMessage('[INIT] Starting feed fetch...');
                        var rss2jsonUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(
                            feedUrl) + '&api_key=' + apiKey;
                        loadingIndicator('[CONNECTING] RSS2JSON API', 1.2, function() {
                            fetchWithTimeout(rss2jsonUrl, {}, 10000)
                                .then(function(resp) {
                                    if (!resp.ok) throw new Error('RSS2JSON failed');
                                    return resp.json();
                                })
                                .then(function(data) {
                                    if (data.status !== 'ok') throw new Error(data.message ||
                                        'RSS2JSON error');
                                    appendSystemMessage('[OK] RSS2JSON connection successful');
                                    var mappedItems = data.items.map(function(item) {
                                        return {
                                            title: item.title,
                                            link: item.link,
                                            pubDate: item.pubDate,
                                            thumbnail: item.thumbnail,
                                            enclosure: item.enclosure,
                                            content: item.content
                                        };
                                    });
                                    processFeedItems(mappedItems);
                                })
                                .catch(function() {
                                    appendErrorMessage(
                                        '[ERROR] RSS2JSON failed, trying direct feed...');
                                    var directJsonUrl = feedUrl + '?alt=json';
                                    loadingIndicator('[CONNECTING] Direct Blogger API', 1.0,
                                        function() {
                                            fetchWithTimeout(directJsonUrl, {}, 5000)
                                                .then(function(resp) {
                                                    if (!resp.ok) throw new Error(
                                                        'Direct failed');
                                                    return resp.json();
                                                })
                                                .then(function(json) {
                                                    if (json.feed && json.feed.entry) {
                                                        appendSystemMessage(
                                                            '[OK] Direct connection successful'
                                                            );
                                                        var items = json.feed
                                                            .entry.map(function(e) {
                                                                return {
                                                                    title: e.title
                                                                        .$t,
                                                                    link: e.link
                                                                        .find(function(
                                                                            l
                                                                            ) {
                                                                            return l
                                                                                .rel ===
                                                                                'alternate';
                                                                        })
                                                                        .href,
                                                                    pubDate: e
                                                                        .published
                                                                        .$t,
                                                                    thumbnail: e
                                                                        .media$thumbnail ?
                                                                        e.media$thumbnail
                                                                        .url :
                                                                        '',
                                                                    content: e
                                                                        .content ?
                                                                        e.content
                                                                        .$t :
                                                                        ''
                                                                };
                                                            });
                                                        processFeedItems(items);
                                                    } else throw new Error(
                                                        'No entries');
                                                })
                                                .catch(function() {
                                                    appendErrorMessage(
                                                        '[WARN] Direct feed failed, trying proxies...'
                                                        );
                                                    var proxies = [
                                                        'https://api.allorigins.win/raw?url=',
                                                        'https://corsproxy.io/?url=',
                                                        'https://api.codetabs.com/v1/proxy?quest=',
                                                        'https://proxy.cors.sh/',
                                                        'https://api.cors.lol/?url=',
                                                        'https://crossorigin.me/',
                                                        'https://cors-anywhere.herokuapp.com/',
                                                        'https://jsonp.afeld.me/?url=',
                                                        'https://thingproxy.freeboard.io/fetch/'
                                                    ];
                                                    var proxyIndex = 0;

                                                    function tryNextProxy() {
                                                        if (proxyIndex >= proxies
                                                            .length) {
                                                            appendErrorMessage(
                                                                '[FATAL] All connection attempts failed'
                                                                );
                                                            typeEffect(
                                                                "Check your network connection or feed URL.\n",
                                                                function() {
                                                                    typeEffect(
                                                                        "Click the Retry button to try again, or use the Open Blog button.\n",
                                                                        null,
                                                                        'system'
                                                                        );
                                                                },
                                                                'error');
                                                            return;
                                                        }
                                                        var proxy = proxies[
                                                            proxyIndex];
                                                        var url = proxy +
                                                            encodeURIComponent(
                                                                feedUrl);
                                                        appendSystemMessage(
                                                            '[INFO] Trying proxy ' +
                                                            (proxyIndex + 1) +
                                                            ' of ' + proxies
                                                            .length);
                                                        loadingIndicator(
                                                            '[CONNECTING] Proxy ' +
                                                            (proxyIndex + 1),
                                                            1.2,
                                                            function() {
                                                                fetchWithTimeout(
                                                                        url, {},
                                                                        8000)
                                                                    .then(
                                                                        function(
                                                                            resp
                                                                            ) {
                                                                            if (!
                                                                                resp
                                                                                .ok
                                                                                ) throw new
                                                                                Error(
                                                                                    'Proxy HTTP ' +
                                                                                    resp
                                                                                    .status
                                                                                    );
                                                                            return resp
                                                                                .text();
                                                                        })
                                                                    .then(

                                                                                ) {

                                                                                    );

                                                                            appendSystemMessage(

                                                                                [];

                                                                                            .querySelector(

                                                                                            .getAttribute(
                                                                                                'url'
                                                                                                ) :
                                                                                            '';
                                                                                        var enclosure =

                                                                                            .querySelector(
                                                                                                'enclosure'
                                                                                                ) ? {
                                                                                                url: entry
                                                                                                    .querySelector(
                                                                                                        'enclosure'
                                                                                                        )
                                                                                                    .getAttribute(

                                                                                                        ),

                                                                            processFeedItems(

                                                                    .catch(

                                                                                    ) +

                                                                                );
                                                                            proxyIndex++;
                                                                            tryNextProxy();
                                                                        });
                                                            });

    <!-- ============================================================
    ENHANCED MATRIX RAIN ANIMATION (Background custom)
    ============================================================ -->
    <script>
        //<![CDATA[
        (function() {
            var config = {
                fontSize: 16,
                fontFamily: 'monospace',
                foregroundSpeed: 0.9,
                backgroundSpeed: 0.4,
                glowSpeed: 0.6,
                charSets: {
                    katakana: "ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ",
                    numeric: "0123456789",
                    alpha: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
                    hex: "0123456789ABCDEF",
                    binary: "01",
                    symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?/~",
                    fullChars: "ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!@#$%^&*()"
                },
                trailFade: 0.05,
                maxDrops: 200,
                hueOffset: 120,
                hueSpeed: 0.3,
                glowIntensity: 0.25
            };

            var canvasFore = document.getElementById('matrixCanvas');
            var canvasBack = document.getElementById('matrixCanvasBack');
            var canvasGlow = document.getElementById('matrixCanvasGlow');
            var ctxFore = canvasFore.getContext('2d');
            var ctxBack = canvasBack.getContext('2d');
            var ctxGlow = canvasGlow.getContext('2d');

            function resizeCanvases() {
                canvasFore.width = window.innerWidth;
                canvasFore.height = window.innerHeight;
                canvasBack.width = window.innerWidth;
                canvasBack.height = window.innerHeight;
                canvasGlow.width = window.innerWidth;
                canvasGlow.height = window.innerHeight;
                initDrops();
            }

            window.addEventListener('resize', resizeCanvases);

            function getRandomChar() {
                var sets = Object.keys(config.charSets);
                var setKey = sets[Math.floor(Math.random() * sets.length)];
                var chars = config.charSets[setKey];
                return chars[Math.floor(Math.random() * chars.length)];
            }

            function getPrimaryChar() {
                var chars = config.charSets.fullChars;
                return chars[Math.floor(Math.random() * chars.length)];
            }

            var dropsFore = [];
            var dropsBack = [];
            var dropsGlow = [];

            function initDrops() {
                var foreCols = Math.ceil(canvasFore.width / config.fontSize);
                var backCols = Math.ceil(canvasBack.width / (config.fontSize * 1.5));
                var glowCols = Math.ceil(canvasGlow.width / (config.fontSize * 1.2));

                dropsFore = [];
                dropsBack = [];
                dropsGlow = [];

                for (var i = 0; i < foreCols; i++) {
                    dropsFore.push({
                        y: Math.random() * -canvasFore.height / config.fontSize,
                        speed: config.foregroundSpeed + Math.random() * 0.8,
                        brightness: Math.random() * 0.7 + 0.3,
                        length: Math.floor(Math.random() * 20 + 5)
                    });
                }
                for (var i = 0; i < backCols; i++) {
                    dropsBack.push({
                        y: Math.random() * -canvasBack.height / config.fontSize,
                        speed: config.backgroundSpeed + Math.random() * 0.5,
                        brightness: Math.random() * 0.4 + 0.15,
                        length: Math.floor(Math.random() * 15 + 3)
                    });
                }
                for (var i = 0; i < glowCols; i++) {
                    dropsGlow.push({
                        y: Math.random() * -canvasGlow.height / config.fontSize,
                        speed: config.glowSpeed + Math.random() * 0.6,
                        brightness: Math.random() * 0.5 + 0.2,
                        length: Math.floor(Math.random() * 25 + 8)
                    });
                }
            }

            var matrixActive = false;

            function getHueColor(hue, saturation, lightness, alpha) {
                return 'hsla(' + hue + ',' + saturation + '%,' + lightness + '%,' + alpha + ')';
            }

            function getRainbowHue(offset) {
                return (config.hueOffset + offset) % 360;
            }

            function drawForeground() {
                ctxFore.fillStyle = 'rgba(0,0,0,' + config.trailFade + ')';
                ctxFore.fillRect(0, 0, canvasFore.width, canvasFore.height);
                ctxFore.font = config.fontSize + 'px ' + config.fontFamily;

                for (var i = 0; i < dropsFore.length; i++) {
                    var drop = dropsFore[i];
                    var x = i * config.fontSize;
                    var hue = getRainbowHue(i * 15);
                    var char = getPrimaryChar();

                    ctxFore.shadowBlur = 12;
                    ctxFore.shadowColor = getHueColor(hue, 100, 60, 0.8);
                    ctxFore.fillStyle = getHueColor(hue, 100, 75, drop.brightness);
                    ctxFore.fillText(char, x, drop.y * config.fontSize);

                    for (var j = 1; j < drop.length; j++) {
                        var alpha = drop.brightness * (1 - j / drop.length) * 0.6;
                        if (alpha <= 0.02) break;
                        var trailHue = getRainbowHue(i * 15 - j * 3);
                        ctxFore.shadowBlur = 8 - j * 0.5;
                        ctxFore.shadowColor = getHueColor(trailHue, 100, 50, alpha * 0.5);
                        ctxFore.fillStyle = getHueColor(trailHue, 100, 60, alpha);
                        var trailChar = getRandomChar();
                        ctxFore.fillText(trailChar, x, (drop.y - j) * config.fontSize);
                    }

                    drop.y += drop.speed;
                    if (drop.y * config.fontSize > canvasFore.height + 100) {
                        drop.y = Math.random() * -50;
                        drop.speed = config.foregroundSpeed + Math.random() * 0.8;
                        drop.length = Math.floor(Math.random() * 20 + 5);
                    }
                }
                ctxFore.shadowBlur = 0;
            }

            function drawBackground() {
                ctxBack.fillStyle = 'rgba(0,0,0,' + (config.trailFade * 0.7) + ')';
                ctxBack.fillRect(0, 0, canvasBack.width, canvasBack.height);
                ctxBack.font = Math.floor(config.fontSize * 1.3) + 'px ' + config.fontFamily;

                for (var i = 0; i < dropsBack.length; i++) {
                    var drop = dropsBack[i];
                    var x = i * config.fontSize * 1.5;
                    var hue = getRainbowHue(i * 8 + 40);
                    var char = getRandomChar();

                    ctxBack.shadowBlur = 6;
                    ctxBack.shadowColor = getHueColor(hue, 80, 40, 0.4);
                    ctxBack.fillStyle = getHueColor(hue, 80, 50, drop.brightness * 0.5);
                    ctxBack.fillText(char, x, drop.y * config.fontSize);

                    for (var j = 1; j < Math.min(drop.length, 8); j++) {
                        var alpha = drop.brightness * (1 - j / drop.length) * 0.3;
                        if (alpha <= 0.01) break;
                        var trailHue = getRainbowHue(i * 8 + 40 - j * 5);
                        ctxBack.shadowBlur = 4;
                        ctxBack.shadowColor = getHueColor(trailHue, 70, 35, alpha * 0.3);
                        ctxBack.fillStyle = getHueColor(trailHue, 70, 45, alpha);
                        ctxBack.fillText(getRandomChar(), x, (drop.y - j) * config.fontSize);
                    }

                    drop.y += drop.speed;
                    if (drop.y * config.fontSize > canvasBack.height + 100) {
                        drop.y = Math.random() * -50;
                        drop.speed = config.backgroundSpeed + Math.random() * 0.5;
                        drop.length = Math.floor(Math.random() * 15 + 3);
                    }
                }
                ctxBack.shadowBlur = 0;
            }

            function drawGlow() {
                ctxGlow.fillStyle = 'rgba(0,0,0,' + (config.trailFade * 0.9) + ')';
                ctxGlow.fillRect(0, 0, canvasGlow.width, canvasGlow.height);
                ctxGlow.font = Math.floor(config.fontSize * 1.1) + 'px ' + config.fontFamily;

                for (var i = 0; i < dropsGlow.length; i++) {
                    var drop = dropsGlow[i];
                    var x = i * config.fontSize * 1.2;
                    var hue = getRainbowHue(i * 20 + 80);
                    var char = getPrimaryChar();

                    ctxGlow.shadowBlur = 20;
                    ctxGlow.shadowColor = getHueColor(hue, 100, 60, 0.6);
                    ctxGlow.fillStyle = getHueColor(hue, 100, 70, drop.brightness * 0.35);
                    ctxGlow.fillText(char, x, drop.y * config.fontSize);

                    for (var j = 1; j < Math.min(drop.length, 12); j++) {
                        var alpha = drop.brightness * (1 - j / drop.length) * 0.25;
                        if (alpha <= 0.01) break;
                        var trailHue = getRainbowHue(i * 20 + 80 - j * 4);
                        ctxGlow.shadowBlur = 15;
                        ctxGlow.shadowColor = getHueColor(trailHue, 90, 50, alpha * 0.4);
                        ctxGlow.fillStyle = getHueColor(trailHue, 90, 55, alpha);
                        ctxGlow.fillText(getRandomChar(), x, (drop.y - j) * config.fontSize);
                    }

                    drop.y += drop.speed;
                    if (drop.y * config.fontSize > canvasGlow.height + 150) {
                        drop.y = Math.random() * -50;
                        drop.speed = config.glowSpeed + Math.random() * 0.6;
                        drop.length = Math.floor(Math.random() * 25 + 8);
                    }
                }
                ctxGlow.shadowBlur = 0;
            }

            function animateMatrix() {
                if (matrixActive) {
                    drawBackground();
                    drawGlow();
                    drawForeground();
                    config.hueOffset = (config.hueOffset + config.hueSpeed) % 360;
                } else {
                    ctxFore.fillStyle = '#000';
                    ctxFore.fillRect(0, 0, canvasFore.width, canvasFore.height);
                    ctxBack.fillStyle = '#000';
                    ctxBack.fillRect(0, 0, canvasBack.width, canvasBack.height);
                    ctxGlow.fillStyle = '#000';
                    ctxGlow.fillRect(0, 0, canvasGlow.width, canvasGlow.height);
                }
                requestAnimationFrame(animateMatrix);
            }

            window.matrixControl = {
                setActive: function(active) {
                    matrixActive = active;
                },
                isActive: function() {
                    return matrixActive;
                },
                burstEffect: function(x, y) {
                    if (!matrixActive) return;
                    var burstChar = document.createElement('div');
                    burstChar.style.cssText =
                        'position:fixed;z-index:999;font-family:monospace;font-size:14px;color:#00ff41;text-shadow:0 0 10px #00ff41;pointer-events:none;transition:all 1s ease-out;';
                    burstChar.textContent = getPrimaryChar();
                    burstChar.style.left = x + 'px';
                    burstChar.style.top = y + 'px';
                    document.body.appendChild(burstChar);
                    setTimeout(function() {
                        burstChar.style.transform = 'translateY(80px)';
                        burstChar.style.opacity = '0';
                    }, 50);
                    setTimeout(function() {
                        burstChar.remove();
                    }, 1200);
                }
            };

            resizeCanvases();
            animateMatrix();

            document.addEventListener('click', function(e) {
                if (matrixActive && e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON') {
                    window.matrixControl.burstEffect(e.clientX, e.clientY);
                }
            });

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    config.hueSpeed = 0.05;
                } else {
                    config.hueSpeed = 0.3;
                }
            });
        })();
        //]]>
    </script>

    <script>

        (function() {

                var fallbackCanvas = document.getElementById('terminalMatrixCanvas');
                var fallbackCtx = fallbackCanvas.getContext('2d');
                var fallbackInterval;

                var fallbackChars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノ";
                var fallbackFontSize = 14;
                var fallbackDrops = [];
                function initFallback() {
                    fallbackCanvas.width = fallbackCanvas.parentElement.clientWidth;
                    fallbackCanvas.height = fallbackCanvas.parentElement.clientHeight;
                    fallbackFontSize = 14;
                    var columns = Math.ceil(fallbackCanvas.width / fallbackFontSize);
                    fallbackDrops = [];
                    for (var i = 0; i < columns; i++) {

                    }
                }
                function drawFallback() {

                        fallbackCtx.fillText(text, i * fallbackFontSize, fallbackDrops[i] * fallbackFontSize);
                        if (fallbackDrops[i] * fallbackFontSize > fallbackCanvas.height && Math.random() > 0.975) {
                            fallbackDrops[i] = 0;
                        }
                        fallbackDrops[i]++;
                    }
                }
                function animateFallback() {
                    drawFallback();
                    requestAnimationFrame(animateFallback);
                }
                window.terminalMatrixControl = {
                    setActive: function(active) {
                        fallbackActive = active;
                        if (active && !fallbackInterval) {
                            initFallback();
                            animateFallback();
                        }
                    },
                    updateOptions: function(options) {
                        if (options.fontSize) fallbackFontSize = options.fontSize;
                        if (options.colorMode) {
                            var colorMap = {
                                'rainbow': function() { return 'hsl(' + (Date.now() % 360) + ',100%,50%)'; },
                                'green': '#00ff41',
                                'blue': '#00aaff',
                                'red': '#ff3333',
                                'white': '#ffffff',
                                'purple': '#aa00ff',
                                'orange': '#ff8800',
                                'yellow': '#ffff00',
                                'cyan': '#00ffff',
                                'pink': '#ff00aa',
                                'custom': options.customColor || '#00ff41'
                            };
                            fallbackCtx.fillStyle = colorMap[options.colorMode] || '#00ff41';
                        }
                    }
                };
                return;
            }

            var terminalCanvas = document.getElementById('terminalMatrixCanvas');
            var terminalMatrixInstance;

            function initTerminalMatrix() {
                if (terminalMatrixInstance) {
                    terminalMatrixInstance.stop();
                }
                terminalMatrixInstance = new Matrix(terminalCanvas, {
                    fontSize: 14,
                    color: '#00ff41',
                    speed: 1,
                    chars: Matrix.defaultChars,
                    fadeFactor: 0.05,
                    background: 'transparent'
                });
                terminalMatrixInstance.start();
            }

            window.terminalMatrixControl = {
                setActive: function(active) {
                    if (active) {
                        if (!terminalMatrixInstance) initTerminalMatrix();
                        else terminalMatrixInstance.start();
                    } else {
                        if (terminalMatrixInstance) terminalMatrixInstance.stop();
                    }
                },
                updateOptions: function(options) {
                    if (!terminalMatrixInstance) initTerminalMatrix();
                    if (options.fontSize) terminalMatrixInstance.setFontSize(options.fontSize);
                    if (options.speed) terminalMatrixInstance.setSpeed(options.speed);
                    if (options.colorMode) {
                        var colorMap = {
                            'rainbow': function() { return 'hsl(' + (Date.now() % 360) + ',100%,50%)'; },
                            'green': '#00ff41',
                            'blue': '#00aaff',
                            'red': '#ff3333',
                            'white': '#ffffff',
                            'purple': '#aa00ff',
                            'orange': '#ff8800',
                            'yellow': '#ffff00',
                            'cyan': '#00ffff',
                            'pink': '#ff00aa',
                            'custom': options.customColor || '#00ff41'
                        };
                        var colorFn = colorMap[options.colorMode] || '#00ff41';
                        terminalMatrixInstance.setColor(colorFn);
                    }
                }
            };

            initTerminalMatrix();
        })();
        //]]>
    </script>

    <script>
        //<![CDATA[
        (function() {
            var speedSlider = document.getElementById('matrixSpeed');
            var fontSizeSlider = document.getElementById('matrixFontSize');
            var colorModeSelect = document.getElementById('matrixColorMode');
            var customColorInput = document.getElementById('matrixCustomColor');
            var customColorItem = document.getElementById('customColorItem');

            var defaults = {
                speed: 1,
                fontSize: 16,
                colorMode: 'rainbow',
                customColor: '#00ff41',
                showTerminal: true
            };

            function updateCustomColorVisibility() {
                if (colorModeSelect.value === 'custom') {
                    customColorItem.style.display = 'flex';
                } else {
                    customColorItem.style.display = 'none';
                }
            }

            function getOptions() {
                return {
                    speed: parseFloat(speedSlider.value),
                    fontSize: parseInt(fontSizeSlider.value),
                    colorMode: colorModeSelect.value,
                    customColor: customColorInput.value,
                    showTerminal: showTerminalCheckbox.checked
                };
            }

            function applyOptions() {
                var opts = getOptions();
                terminalMatrixContainer.style.opacity = opts.showTerminal ? '0.3' : '0';
                if (window.terminalMatrixControl) {
                    window.terminalMatrixControl.updateOptions(opts);
                    if (opts.showTerminal && !window.terminalMatrixControl._active) {
                        window.terminalMatrixControl.setActive(true);
                    } else if (!opts.showTerminal && window.terminalMatrixControl._active) {
                        window.terminalMatrixControl.setActive(false);
                    }
                }
            }

            speedSlider.addEventListener('input', applyOptions);
            fontSizeSlider.addEventListener('input', applyOptions);
            colorModeSelect.addEventListener('change', function() {
                updateCustomColorVisibility();
                applyOptions();
            });
            customColorInput.addEventListener('input', applyOptions);
            showTerminalCheckbox.addEventListener('change', applyOptions);

            resetBtn.addEventListener('click', function() {
                speedSlider.value = defaults.speed;
                fontSizeSlider.value = defaults.fontSize;
                colorModeSelect.value = defaults.colorMode;
                customColorInput.value = defaults.customColor;
                showTerminalCheckbox.checked = defaults.showTerminal;
                updateCustomColorVisibility();
                applyOptions();
            });

            // Initialize custom color visibility
            updateCustomColorVisibility();
            applyOptions();

            window.startLoading = (function(original) {
                return function() {
                    if (original) original();
                    if (showTerminalCheckbox.checked && window.terminalMatrixControl) {
                        window.terminalMatrixControl.setActive(true);
                    }
                };
            })(window.startLoading);
        })();
        //]]>
    </script>
