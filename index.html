                    '<select class="pf-modal-select" id="pf-wm-pos"><option value="bottom-right" selected>Bottom Right</option><option value="bottom-left">Bottom Left</option><option value="top-right">Top Right</option><option value="top-left">Top Left</option><option value="center">Center</option></select></div>',
                    '<button class="pf-btn pf-btn-primary" id="pf-wm-apply"><i class="fa-solid fa-stamp"></i> Apply</button>' +
                    '<button class="pf-btn pf-btn-secondary" id="pf-wm-cancel">Cancel</button>'
                );
                var opRange = document.getElementById('pf-wm-op');
                var opVal = document.getElementById('pf-wm-op-val');
                if (opRange && opVal) opRange.addEventListener('input', function() { opVal.textContent = opRange
                        .value + '%'; });
                document.getElementById('pf-wm-apply').addEventListener('click', function() {
                    var text = document.getElementById('pf-wm-text').value || 'PhotoForge';
                    var opacity = parseInt(opRange.value, 10) / 100;
                    var position = document.getElementById('pf-wm-pos').value;
                    closeModal();
                    getImageObject().then(function(img) {
                        var canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        var fontSize = Math.max(20, Math.round(canvas.width * 0.04));
                        ctx.font = 'bold ' + fontSize +
                            'px "Inter", "Segoe UI", Arial, sans-serif';
                        ctx.fillStyle = 'rgba(255,255,255,' + opacity + ')';
                        ctx.strokeStyle = 'rgba(0,0,0,' + (opacity * 0.7) + ')';
                        ctx.lineWidth = Math.max(2, fontSize * 0.08);
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        var padding = fontSize * 0.5;
                        var metrics = ctx.measureText(text);
                        var tw = metrics.width;
                        var th = fontSize * 1.2;
                        var x, y;
                        switch (position) {
                            case 'bottom-right':
                                x = canvas.width - tw / 2 - padding;
                                y = canvas.height - th / 2 - padding;
                                break;
                            case 'bottom-left':
                                x = tw / 2 + padding;
                                y = canvas.height - th / 2 - padding;
                                break;
                            case 'top-right':
                                x = canvas.width - tw / 2 - padding;
                                y = th / 2 + padding;
                                break;
                            case 'top-left':
                                x = tw / 2 + padding;
                                y = th / 2 + padding;
                                break;
                            default:
                                x = canvas.width / 2;
                                y = canvas.height / 2;
                        }
                        ctx.strokeText(text, x, y);
                        ctx.fillText(text, x, y);
                        return loadImageToEditor(canvas.toDataURL('image/png'), 'Watermarked');
                    }).then(function() {
                        showToast('💧 Watermark added');
                        pushHistory();
                        autoSave();
                    }).catch(function() { showToast('⚠️ Failed'); });
                });
                document.getElementById('pf-wm-cancel').addEventListener('click', closeModal);
            }

            // ================= BLUR REGION =================
            function startBlurMode() {
                if (!isReady) { showToast('⚠️ Not ready'); return; }
                if (blurModeActive) { blurModeActive = false;
                    showToast('Blur mode cancelled'); return; }
                blurModeActive = true;
                showToast('🖱️ Drag on image to blur region');
            }

            function applyBlurRegion(sx, sy, ex, ey) {
                if (!isReady || !blurModeActive) return;
                blurModeActive = false;
                var dataURL = getDataURL('png', 1.0);
                if (!dataURL) return;
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    var scaleX = img.naturalWidth / editorWrapper.clientWidth;
                    var scaleY = img.naturalHeight / editorWrapper.clientHeight;
                    var bx = Math.max(0, Math.min(Math.min(sx, ex) * scaleX, canvas.width));
                    var by = Math.max(0, Math.min(Math.min(sy, ey) * scaleY, canvas.height));
                    var bw = Math.min(Math.abs(ex - sx) * scaleX, canvas.width - bx);
                    var bh = Math.min(Math.abs(ey - sy) * scaleY, canvas.height - by);
                    if (bw < 5 || bh < 5) { showToast('⚠️ Region too small'); return; }
                    var imageData = ctx.getImageData(bx, by, bw, bh);
                    var data = imageData.data;
                    var radius = Math.max(3, Math.round(Math.min(bw, bh) * 0.05));
                    var temp = new Uint8ClampedArray(data);
                    for (var y = 0; y < bh; y++) {
                        for (var x = 0; x < bw; x++) {
                            var r = 0,
                                g = 0,
                                b = 0,
                                count = 0;
                            for (var dy = -radius; dy <= radius; dy++) {
                                for (var dx = -radius; dx <= radius; dx++) {
                                    var nx = x + dx,
                                        ny = y + dy;
                                    if (nx >= 0 && nx < bw && ny >= 0 && ny < bh) {
                                        var idx = (ny * bw + nx) * 4;
                                        r += temp[idx];
                                        g += temp[idx + 1];
                                        b += temp[idx + 2];
                                        count++;
                                    }
                                }
                            }
                            var idx2 = (y * bw + x) * 4;
                            data[idx2] = r / count;
                            data[idx2 + 1] = g / count;
                            data[idx2 + 2] = b / count;
                        }
                    }
                    ctx.putImageData(imageData, bx, by);
                    loadImageToEditor(canvas.toDataURL('image/png'), 'Blurred')
                        .then(function() { showToast('🔒 Region blurred');
                            pushHistory();
                            autoSave(); });
                };
                img.src = dataURL;
            }

            // ================= HTML TO IMAGE =================
            function htmlToImageCapture() {
                showModal('HTML to Image',
                    '<p style="font-size:0.7rem;">Capture current view as image using html2canvas.</p>',
                    '<button class="pf-btn pf-btn-primary" id="pf-html-apply"><i class="fa-solid fa-camera"></i> Capture</button>' +
                    '<button class="pf-btn pf-btn-secondary" id="pf-html-cancel">Cancel</button>'
                );
                document.getElementById('pf-html-apply').addEventListener('click', function() {
                    closeModal();
                    html2canvas(editorEl, {
                        backgroundColor: '#0a0a14',
                        useCORS: true,
                        allowTaint: true,
                        logging: false,
                        scale: window.devicePixelRatio || 1,
                    }).then(function(canvas) {
                        return loadImageToEditor(canvas.toDataURL('image/png'), 'HTMLSnapshot');
                    }).then(function() {
                        showToast('📸 Captured');
                        pushHistory();
                        autoSave();
                    }).catch(function() { showToast('⚠️ Capture failed'); });
                });
                document.getElementById('pf-html-cancel').addEventListener('click', closeModal);
            }

            // ================= EXACT RESIZE =================
            function exactResize() {
                if (!isReady) { showToast('⚠️ Not ready'); return; }
                showModal('Exact Resize',
                    '<div style="display:flex;gap:8px;margin:8px 0;">' +
                    '<div style="flex:1;"><label style="display:block;font-size:0.62rem;color:#aaa;">Width</label>' +
                    '<input type="number" class="pf-modal-input" id="pf-rw" value="800" min="10" max="8000"></div>' +
                    '<div style="flex:1;"><label style="display:block;font-size:0.62rem;color:#aaa;">Height</label>' +
                    '<input type="number" class="pf-modal-input" id="pf-rh" value="600" min="10" max="8000"></div></div>',
                    '<button class="pf-btn pf-btn-primary" id="pf-resize-apply"><i class="fa-solid fa-ruler"></i> Resize</button>' +
                    '<button class="pf-btn pf-btn-secondary" id="pf-resize-cancel">Cancel</button>'
                );
                document.getElementById('pf-resize-apply').addEventListener('click', function() {
                    var w = parseInt(document.getElementById('pf-rw').value, 10);
                    var h = parseInt(document.getElementById('pf-rh').value, 10);
                    closeModal();
                    if (w < 10 || h < 10 || w > 8000 || h > 8000) { showToast('⚠️ Invalid dims'); return; }
                    getImageObject().then(function(img) {
                        var canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        var ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, w, h);
                        return loadImageToEditor(canvas.toDataURL('image/png'), 'Resized');
                    }).then(function() {
                        showToast('📐 Resized');
                        pushHistory();
                        autoSave();
                    }).catch(function() { showToast('⚠️ Failed'); });
                });
                document.getElementById('pf-resize-cancel').addEventListener('click', closeModal);
            }

            // ================= CROP =================
            function activateCrop() {
                if (!isReady) { showToast('⚠️ Not ready'); return; }
                try { imageEditor.startDrawingMode('CROPPER');
                    showToast('✂️ Crop mode active'); } catch (e) { showToast('⚠️ Crop failed'); }
            }

            // ================= ROTATE =================
            function rotateImage() {
                if (!isReady) { showToast('⚠️ Not ready'); return; }
                try { imageEditor.rotate(90);
                    showToast('🔄 Rotated 90°'); } catch (e) { showToast('⚠️ Rotate failed'); }
            }

            // ================= SAVE LOCAL =================
            function saveLocal() {
                if (!isReady) { showToast('⚠️ Not ready'); return; }
                showModal('Save to Local Storage',
                    '<p style="font-size:0.7rem;">Enter a name for this image.</p>' +
                    '<input type="text" class="pf-modal-input" id="pf-save-name" placeholder="My Image">',
                    '<button class="pf-btn pf-btn-primary" id="pf-save-apply"><i class="fa-solid fa-database"></i> Save</button>' +
                    '<button class="pf-btn pf-btn-secondary" id="pf-save-cancel">Cancel</button>'
                );
                document.getElementById('pf-save-apply').addEventListener('click', function() {
                    var name = document.getElementById('pf-save-name').value || 'Untitled';
                    closeModal();
                    var dataURL = getDataURL('png', 1.0);
                    if (!dataURL) { showToast('⚠️ No image to save'); return; }
                    saveImageToDB(dataURL, name).then(function() {
                        updateGallery();
                        if (!isRightPanelOpen) toggleRightPanel(true);
                        showToast('💾 Saved to local storage');
                    }).catch(function(e) { console.error(e);
                        showToast('⚠️ Save failed'); });
                });
                document.getElementById('pf-save-cancel').addEventListener('click', closeModal);
            }

            // ================= DRAG & DROP =================
            function setupDragDrop() {
                editorWrapper.addEventListener('dragover', function(e) { e.preventDefault(); });
                editorWrapper.addEventListener('drop', function(e) {
                    e.preventDefault();
                    if (e.dataTransfer.files.length > 0) uploadImage(e.dataTransfer.files[0]);
                });
                document.addEventListener('dragover', function(e) { e.preventDefault(); });
                document.addEventListener('drop', function(e) { e.preventDefault(); });
            }

            // ================= PASTE =================
            function setupPaste() {
                document.addEventListener('paste', function(e) {
                    var items = e.clipboardData && e.clipboardData.items;
                    if (!items) return;
                    for (var i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf('image') !== -1) {
                            var file = items[i].getAsFile();
                            if (file) { uploadImage(file);
                                showToast('📋 Image pasted'); }
                            break;
                        }
                    }
                });
            }

            // ================= EVENTS =================
            function setupEvents() {
                if (btnUpload) btnUpload.addEventListener('click', function() { fileInput.click(); });
                if (fileInput) fileInput.addEventListener('change', function() {
                    if (this.files && this.files.length > 0) { uploadImage(this.files[0]);
                        this.value = ''; }
                });
                if (btnUndo) btnUndo.addEventListener('click', performUndo);
                if (btnRedo) btnRedo.addEventListener('click', performRedo);
                if (btnReset) btnReset.addEventListener('click', resetToOriginal);
                if (btnDlPng) btnDlPng.addEventListener('click', function() { downloadImage('png'); });
                if (btnDlJpeg) btnDlJpeg.addEventListener('click', function() { downloadImage('jpeg'); });
                if (btnDlWebp) btnDlWebp.addEventListener('click', function() { downloadImage('webp'); });
                if (btnCompress) btnCompress.addEventListener('click', compressImage);
                if (btnUpscale) btnUpscale.addEventListener('click', upscaleImage);
                if (btnBgRemove) btnBgRemove.addEventListener('click', removeBackground);
                if (btnWatermark) btnWatermark.addEventListener('click', addWatermark);
                if (btnBlur) btnBlur.addEventListener('click', startBlurMode);
                if (btnHtmlImg) btnHtmlImg.addEventListener('click', htmlToImageCapture);
                if (btnResize) btnResize.addEventListener('click', exactResize);
                if (btnCrop) btnCrop.addEventListener('click', activateCrop);
                if (btnRotate) btnRotate.addEventListener('click', rotateImage);
                if (btnFilterRainbow) btnFilterRainbow.addEventListener('click', function() { applyCanvasFilter(
                        'rainbow'); });
                if (btnFilterSunset) btnFilterSunset.addEventListener('click', function() { applyCanvasFilter(
                        'sunset'); });
                if (btnFilterPrison) btnFilterPrison.addEventListener('click', function() { applyCanvasFilter(
                        'prison'); });
                if (btnFilterCrumble) btnFilterCrumble.addEventListener('click', function() { applyCanvasFilter(
                        'crumble'); });
                if (btnSaveLocal) btnSaveLocal.addEventListener('click', saveLocal);

                var sliderIds = ['exposure', 'saturation', 'hue', 'blur', 'opacity'];
                sliderIds.forEach(function(sid) {
                    var slider = document.getElementById('pf-slider-' + sid);
                    var valEl = document.getElementById('pf-slider-' + sid + '-val');
                    if (slider && valEl) {
                        slider.addEventListener('input', function() {
                            if (sid === 'hue') valEl.textContent = this.value + '°';
                            else valEl.textContent = this.value;
                            updateSliderDisplay();
                        });
                    }
                });

                document.querySelectorAll('.pf-slider-reset').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var target = this.getAttribute('data-reset');
                        var defaults = { exposure: 0, saturation: 100, hue: 0, blur: 0, opacity: 100 };
                        if (target && defaults[target] !== undefined) {
                            var slider = document.getElementById('pf-slider-' + target);
                            var valEl = document.getElementById('pf-slider-' + target + '-val');
                            if (slider && valEl) {
                                slider.value = defaults[target];
                                if (target === 'hue') valEl.textContent = '0°';
                                else valEl.textContent = String(defaults[target]);
                                updateSliderDisplay();
                            }
                        }
                    });
                });

                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'S' || e.key === 's')) { e
                            .preventDefault();
                        downloadImage('png'); }
                    if ((e.ctrlKey || e.metaKey) && e.altKey && (e.key === 'S' || e.key === 's')) { e
                            .preventDefault();
                        downloadImage('jpeg'); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault();
                        performUndo(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault();
                        performRedo(); }
                    if (e.key === 'Escape' && blurModeActive) { blurModeActive = false;
                        showToast('Blur cancelled'); }
                    if (e.key === 'Escape' && modalOverlay.classList.contains('pf-active')) closeModal();
                });

                editorWrapper.addEventListener('mousedown', function(e) {
                    if (!blurModeActive) return;
                    blurStartPos = { x: e.offsetX, y: e.offsetY };
                    e.preventDefault();
                });
                editorWrapper.addEventListener('mouseup', function(e) {
                    if (!blurModeActive || !blurStartPos) return;
                    applyBlurRegion(blurStartPos.x, blurStartPos.y, e.offsetX, e.offsetY);
                    blurStartPos = null;
                });
                editorWrapper.addEventListener('touchstart', function(e) {
                    if (!blurModeActive) return;
                    var t = e.touches[0];
                    var rect = editorWrapper.getBoundingClientRect();
                    blurStartPos = { x: t.clientX - rect.left, y: t.clientY - rect.top };
                    e.preventDefault();
                }, { passive: false });
                editorWrapper.addEventListener('touchend', function(e) {
                    if (!blurModeActive || !blurStartPos) return;
                    var t = e.changedTouches[0];
                    var rect = editorWrapper.getBoundingClientRect();
                    applyBlurRegion(blurStartPos.x, blurStartPos.y, t.clientX - rect.left, t.clientY - rect
                        .top);
                    blurStartPos = null;
                });
            }

            // ================= STARTUP =================
            function startup() {
                initEditor();
                setupEvents();
                setupDragDrop();
                setupPaste();

                openDB().then(function() {
                    updateGallery();
                }).catch(function(e) {
                    console.warn('IndexedDB not supported?', e);
                    showToast('⚠️ Local storage not available');
                });

                setTimeout(function() {
                    if (loadingOverlay && !loadingOverlay.classList.contains('pf-hidden')) {
                        loadingOverlay.classList.add('pf-hidden');
                    }
                }, 10000);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startup);
            } else {
                startup();
            }

            window.PhotoForgeStudio = {
                getEditor: function() { return imageEditor; },
                download: downloadImage,
                upload: uploadImage,
                reset: resetToOriginal,
                undo: performUndo,
                redo: performRedo,
                compress: compressImage,
                upscale: upscaleImage,
                removeBackground: removeBackground,
                watermark: addWatermark,
                blurRegion: startBlurMode,
                htmlToImage: htmlToImageCapture,
                resize: exactResize,
                crop: activateCrop,
                rotate: rotateImage,
                applyFilter: applyCanvasFilter,
                saveLocal: saveLocal,
                loadLocalGallery: updateGallery,
                autoSave: autoSave,
                toggleLeftPanel: toggleLeftPanel,
                toggleGallery: toggleRightPanel,
            };
        })();
    </script>
</body>
</html>
